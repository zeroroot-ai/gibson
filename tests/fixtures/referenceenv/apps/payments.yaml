# Service payments. Flaw: the database password and an API key are plain
# environment variables of the pod, so anyone with code execution in the pod
# reads them (flaw "credential-in-environment").
# Fix: remove the variables and mount a Secret as a file with mode 0400.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  annotations:
    refenv.zeroroot.ai/health-url: http://payments.refenv.svc.cluster.local:8080/healthz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: payments
          image: busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command:
            - sh
            - -c
            - mkdir -p /www && echo ok > /www/healthz && exec httpd -f -p 8080 -h /www
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              value: refenv-db-pw-4f9a1c
            - name: PAYMENTS_API_KEY
              value: refenv-api-key-77d2e0
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: payments
spec:
  selector:
    app: payments
  ports:
    - port: 8080
      targetPort: 8080
