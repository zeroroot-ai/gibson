# Service log-shipper. Flaw: the pod mounts the kubelet pods directory of the
# node, so it reads the service account token of each other pod on that node
# (flaw "node-token-readable").
# Fix: remove the hostPath volume and ship logs through the API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-shipper
  annotations:
    refenv.zeroroot.ai/health-url: http://log-shipper.refenv.svc.cluster.local:8080/healthz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-shipper
  template:
    metadata:
      labels:
        app: log-shipper
    spec:
      containers:
        - name: log-shipper
          image: busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command:
            - sh
            - -c
            - mkdir -p /www && echo ok > /www/healthz && exec httpd -f -p 8080 -h /www
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          volumeMounts:
            - name: kubelet-pods
              mountPath: /var/lib/kubelet/pods
              readOnly: true
      volumes:
        - name: kubelet-pods
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: log-shipper
spec:
  selector:
    app: log-shipper
  ports:
    - port: 8080
      targetPort: 8080
