version: 2
updates:
  - package-ecosystem: "docker"
    # Every directory that holds a Dockerfile with a digest-pinned FROM.
    # Scorecard Pinned-Dependencies wants the digest; this entry keeps it
    # moving when the mirror or upstream refreshes the tag.
    directories:
      - "/"
      - "/build"
      - "/sidecar/belief"
      - "/tools/gibson-bootstrap"
      - "/tests/e2e/fixtures/agents/probe"
      - "/tests/e2e/fixtures/targets/test-target"
    schedule: { interval: "weekly" }
    labels: ["dependencies", "docker"]
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: "gomod"
    directory: "/"
    schedule: { interval: "weekly" }
    labels: ["dependencies", "go"]
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    labels: ["dependencies", "github-actions"]
    commit-message: { prefix: "chore(deps)" }
