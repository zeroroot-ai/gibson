# CodeQL configuration. Pin bundle + queries via Renovate (PRD 1.5).
name: "zeroroot-ai default CodeQL config"

# The custom queries of the org are in zeroroot-ai/.github
# actions/codeql-queries. The shared workflow reusable-codeql.yml loads them,
# and this repo moves to that workflow with gibson#684.
queries:
  - uses: security-and-quality

# Exclude generated code paths from analysis surface.
paths-ignore:
  - "**/zz_generated*.go"
  - "**/*.pb.go"
  - "**/*_grpc.pb.go"
  - "vendor/**"
  - "**/testdata/**"
  - "**/.worktrees/**"
