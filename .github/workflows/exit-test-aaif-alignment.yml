# ----------------------------------------------------------------------------
# The AAIF alignment exit test (epic gibson#1404).
#
# In plain words: a mission agent calls its model through agentgateway with Open
# Responses. The gateway asks ext-authz for each call. The daemon reads the
# gateway trace and writes one llm_call.observed event for each call, with all
# items, the token counts and the cost. One agent delegates to a second agent over
# A2A through the same gateway.
#
# The steps:
#   1. The kind bring-up of the AAIF exit tests (the action aaif-exit-cluster).
#      The chart must be the branch with the gateway (epic/aaif-alignment) until it
#      merges. Start the run by dispatch with the input charts-ref.
#   2. The mock model provider (tests/fixtures/mockprovider) runs in the namespace
#      gibson-e2e-mock. A TLS front serves it over https, because a ModelProvider
#      takes an https base URL. The tenant provider record points at it.
#   3. TestAAIFAlignment_OpenAIPath and TestAAIFAlignment_A2ADelegation run in the
#      cluster as Jobs.
#   4. The daemon counters of the trace receiver show no dropped span (point 10).
#
# Not selected here:
#   - TestAAIFAlignment_AnthropicPath. The gateway serves Open Responses to an
#     OpenAI backend only. The Anthropic path waits for an upstream release
#     (gibson#1406).
# Not covered:
#   - Point 9, a delegation to an outside agent with no grant. It is not built
#     (gibson#1403).
#
# ADR-0080: NEVER on pull_request and never on a schedule. It needs a live cluster.
# It runs on main and on dispatch.
# ----------------------------------------------------------------------------
name: exit-test-aaif-alignment

on:
  push:
    branches: [main]
    paths:
      - 'internal/engine/modelclient/**'
      - 'internal/engine/llmtrace/**'
      - 'internal/server/extauthz/**'
      - 'internal/server/a2aserver/**'
      - 'internal/server/daemon/a2a_*.go'
      - 'internal/server/daemon/api/llmtrace_receiver.go'
      - 'internal/engine/brain/llm_call.go'
      - 'internal/engine/harness/resolve_*.go'
      - 'internal/platform/component/service_resolve.go'
      - 'operators/tenant/internal/modelprovider/**'
      - 'tests/e2e/aaif_alignment_test.go'
      - 'tests/e2e/helpers/**'
      - 'tests/fixtures/mockprovider/**'
      - '.github/actions/aaif-exit-cluster/**'
      - '.github/scripts/run-e2e-job.sh'
      - '.github/workflows/exit-test-aaif-alignment.yml'
  workflow_dispatch:
    inputs:
      charts-ref:
        description: The ref of zeroroot-ai/charts to install. Use epic/aaif-alignment until it merges.
        required: false
        default: main

# One run at a time, and a run that started finishes (gibson#151).
concurrency:
  group: exit-test-aaif-alignment-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CHARTS_ROOT: ${{ github.workspace }}/charts
  NS: gibson
  RELEASE: gibson
  CLUSTER: gibson
  NODE: gibson-control-plane
  E2E_OUT: ${{ github.workspace }}/e2e-out
  MOCK_NS: gibson-e2e-mock

jobs:
  aaif-alignment:
    name: a mission agent calls its model and delegates through agentgateway
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout gibson
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gibson

      # hosted is private, so the checkout needs the org read PAT.
      - name: Checkout hosted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zeroroot-ai/hosted
          path: hosted
          token: ${{ secrets.GH_PAT_PLATFORM_RO }}

      - name: Checkout charts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zeroroot-ai/charts
          ref: ${{ inputs.charts-ref || 'main' }}
          path: charts

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v5
        with:
          go-version-file: gibson/go.mod
          cache-dependency-path: gibson/go.sum

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v3.16.2

      - name: Install kind + kubectl
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          install_only: true

      - name: Install terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      # A full platform on kind opens more inotify instances than the runner
      # allows. The limits go up before the cluster starts (gibson#1331).
      - name: Raise the inotify limits
        uses: zeroroot-ai/.github/.github/actions/raise-inotify-limits@88cbc77697ff7143c98f29f3c4d80a93a666d601 # v0.23.0

      - name: Stand up the cluster with the images of the checkout
        uses: ./gibson/.github/actions/aaif-exit-cluster
        with:
          ghcr-ro-pat: ${{ secrets.GHCR_RO_PAT }}
          with-kvm: "false"
          image-tag: aaif-gateway

      # The mock provider of the exit test. The script of the mock builds the
      # image, makes the certificate for the Service name and writes the two URLs
      # to the env file. It keeps the CA in the file mock-ca.crt of the run, for
      # the diagnostics. The model gate exit test uses the same script.
      - name: Start the mock model provider
        working-directory: gibson
        run: bash tests/fixtures/mockprovider/deploy.sh /tmp/e2e-runner.env

      # The gateway, ext-authz and the trace collector must run before the test
      # sends a call. A missing part fails here with its name, not as a timeout.
      - name: The gateway namespace is up
        run: |
          set -euo pipefail
          gw_ns="${NS}-gateway"
          for _ in $(seq 1 60); do
            n=$(kubectl -n "$gw_ns" get pods --no-headers 2>/dev/null | grep -c Running || true)
            [ "$n" -ge 1 ] && break
            sleep 10
          done
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::no gateway proxy pod runs in ${gw_ns}. Is charts-ref the branch with the gateway?"
            kubectl -n "$gw_ns" get pods,gateway,httproute,agentgatewaybackend || true
            kubectl -n "$NS" get pods || true
            exit 1
          fi
          kubectl -n "$gw_ns" get pods

      - name: The AAIF alignment exit test, model calls
        env:
          E2E_RUNNER_ENV_FILE: /tmp/e2e-runner.env
        run: |
          set -o pipefail
          mkdir -p "$E2E_OUT"
          gibson/.github/scripts/run-e2e-job.sh gibson-e2e-aaif-model 'TestAAIFAlignment_OpenAIPath$' 30m \
            2>&1 | tee "$E2E_OUT/aaif-model.log"

      - name: The AAIF alignment exit test, delegation over A2A
        if: ${{ !cancelled() }}
        env:
          E2E_RUNNER_ENV_FILE: /tmp/e2e-runner.env
        run: |
          set -o pipefail
          mkdir -p "$E2E_OUT"
          gibson/.github/scripts/run-e2e-job.sh gibson-e2e-aaif-a2a 'TestAAIFAlignment_A2ADelegation$' 20m \
            2>&1 | tee "$E2E_OUT/aaif-a2a.log"

      # Point 10. The metrics listener of the daemon (port 9090) speaks TLS and
      # demands a client certificate. The step reads it as the cluster scraper
      # does: with the client certificate of the Secret gibson-metrics-scraper-tls
      # (the one the ServiceMonitor names) and the CA of gibson-daemon-metrics-tls,
      # and with the service name of the daemon as the server name. It does not
      # skip the verification. A port-forward carries the connection. A call that
      # ext-authz or the router refused has no tenant. The daemon counts it in
      # gibson_gateway_llm_refused_total and not as a drop.
      - name: The trace receiver of the daemon dropped no span
        if: ${{ !cancelled() }}
        working-directory: gibson
        run: |
          set -euo pipefail
          bash tests/fixtures/mockprovider/check-drop-counter.sh --selftest
          tls=$(mktemp -d)
          trap 'rm -rf "$tls"; kill "${pf:-0}" 2>/dev/null || true' EXIT
          get() { kubectl -n "$NS" get secret "$1" -o jsonpath="{.data.$2}" | base64 -d; }
          get gibson-metrics-scraper-tls 'tls\.crt' > "$tls/client.crt"
          get gibson-metrics-scraper-tls 'tls\.key' > "$tls/client.key"
          get gibson-daemon-metrics-tls 'ca\.crt' > "$tls/ca.crt"
          host="gibson-gibson-workloads.${NS}.svc"
          pod=$(kubectl -n "$NS" get pod -l app.kubernetes.io/component=daemon -o name | head -n 1)
          kubectl -n "$NS" port-forward "$pod" 19090:9090 >/tmp/pf-metrics.log 2>&1 &
          pf=$!
          for _ in $(seq 1 30); do
            curl -sf --cacert "$tls/ca.crt" --cert "$tls/client.crt" --key "$tls/client.key" \
              --connect-to "${host}:9090:127.0.0.1:19090" -o /tmp/daemon-metrics.txt \
              "https://${host}:9090/metrics" && break
            sleep 2
          done
          if [ ! -s /tmp/daemon-metrics.txt ]; then
            echo "::error::the metrics listener of the daemon gave no answer on port 9090 to the scraper certificate"
            cat /tmp/pf-metrics.log || true
            exit 1
          fi
          cp /tmp/daemon-metrics.txt "$E2E_OUT/daemon-metrics.txt"
          bash tests/fixtures/mockprovider/check-drop-counter.sh /tmp/daemon-metrics.txt

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aaif-alignment-${{ github.run_id }}
          path: ${{ github.workspace }}/e2e-out
          if-no-files-found: ignore

      # always(), not failure(): a job that hits timeout-minutes is cancelled,
      # and a cancelled job skips failure() steps.
      - name: Argo bringup diagnostics
        if: always()
        working-directory: gibson
        run: bash scripts/ci/dump-bringup-diagnostics.sh

      - name: Diagnostics
        if: always()
        run: |
          kubectl -n "${NS}-gateway" get pods,gateway,httproute,agentgatewaybackend,agentgatewaypolicy -o wide || true
          kubectl -n "${NS}-gateway" logs --all-containers --tail=200 -l app.kubernetes.io/name=gibson-gateway || true
          kubectl -n "$NS" logs -l app.kubernetes.io/component=ext-authz --tail=300 || true
          kubectl -n "$NS" logs -l app.kubernetes.io/component=daemon -c gibson --tail=5000 \
            | grep -iE 'llmtrace|gateway|a2a|llm_call|mission' | tail -200 || true
          kubectl -n "$NS" logs -l app.kubernetes.io/component=tenant-operator --tail=300 || true
          kubectl -n "$MOCK_NS" get pods -o wide || true
          kubectl -n "$MOCK_NS" logs deploy/mock-provider --all-containers --tail=100 || true
