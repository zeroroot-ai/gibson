# ----------------------------------------------------------------------------
# The fix loop exit test (epic gibson#1454, slice gibson#1469).
#
# In plain words: a tenant enables the connector of its Git host and the connector
# of its metrics. Both call a mock forge over TLS. The mock is the test image
# mock-forge of zeroroot-ai/connectors. It runs as a container next to the kind
# nodes. The forge has a private CA, so each connector mounts the CA bundle that
# the tenant stored as a secret (gibson#1517).
#
# The steps:
#   1. The kind bring-up of the AAIF exit tests (the action aaif-exit-cluster),
#      with the connector operator of the checkout, the install patterns for the
#      mock host and the mock forge.
#   2. The test TestFixLoop runs in the cluster as a Job (tests/e2e/fix_loop_test.go).
#      It reads the daemon API only. It never writes a status or a database.
#
# The chart must carry the field spec.caBundleSecret in the CRD
# connectorinstances.gibson.zeroroot.ai. With an older chart the API server drops
# the field, and the pod gets no bundle. Start the run by dispatch with the input
# charts-ref until the chart is on main.
#
# ADR-0080: NEVER on pull_request and never on a schedule. It runs on main and on
# dispatch.
# ----------------------------------------------------------------------------
name: exit-test-fix-loop

on:
  push:
    branches: [main]
    paths:
      - 'internal/engine/fixloop/**'
      - 'internal/engine/brain/fixloop.go'
      - 'internal/engine/brain/exposure.go'
      - 'internal/server/daemon/fix_loop_runner.go'
      - 'internal/server/daemon/dependency_alerts.go'
      - 'internal/server/daemon/opened_heads.go'
      - 'internal/engine/blueteam/**'
      - 'internal/platform/missioncatalog/**'
      - 'internal/platform/componentcatalog/**'
      - 'operators/connector/**'
      - 'tests/e2e/fix_loop_test.go'
      - 'tests/e2e/fix_loop_cases_test.go'
      - 'tests/e2e/helpers/**'
      - '.github/actions/aaif-exit-cluster/**'
      - '.github/scripts/run-e2e-job.sh'
      - '.github/workflows/exit-test-fix-loop.yml'
  workflow_dispatch:
    inputs:
      charts-ref:
        description: The ref of zeroroot-ai/charts to install.
        required: false
        default: main

# One run at a time, and a run that started finishes (gibson#151).
concurrency:
  group: exit-test-fix-loop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CHARTS_ROOT: ${{ github.workspace }}/charts
  NS: gibson
  # The namespace of the tenant of the test (fixLoopTenant in tests/e2e/fix_loop_test.go).
  TENANT_NS: tenant-primary
  RELEASE: gibson
  CLUSTER: gibson
  NODE: gibson-control-plane
  E2E_OUT: ${{ github.workspace }}/e2e-out
  # mock-forge of zeroroot-ai/connectors at tag 0.9.0, by the digest of the tag (checked with
  # docker buildx imagetools inspect). The release notes list the same digest (connectors#42).
  MOCK_FORGE_IMAGE: ghcr.io/zeroroot-ai/connectors-mock-forge@sha256:6fa53378d29ff161c8bf53e1170573b81837906c2d7abff6e86047e6197769c1

jobs:
  fix-loop:
    name: the connectors of the fix loop trust the CA of the mock forge
    runs-on: ubuntu-latest
    # The go test timeout is 250 minutes. The cluster start-up and the steps after
    # the test need up to 60 minutes more, so the job never ends before the test.
    timeout-minutes: 330
    env:
      EXIT_TEST_ANTHROPIC_API_KEY: ${{ secrets.EXIT_TEST_ANTHROPIC_API_KEY }}
      EXIT_TEST_ANTHROPIC_WORKSPACE_ID: ${{ vars.EXIT_TEST_ANTHROPIC_WORKSPACE_ID }}
    steps:
      # The fix agent runs its coding job on a bank of Claude members, so the test
      # needs the key and the workspace id, as the bank exit test does. A missing
      # one fails the run and says so.
      - name: The key the members sign in with
        run: |
          if [ -z "${EXIT_TEST_ANTHROPIC_API_KEY}" ]; then
            echo "::error title=exit-test-fix-loop cannot run::the repository secret EXIT_TEST_ANTHROPIC_API_KEY is empty."
            exit 1
          fi
          if [ -z "${EXIT_TEST_ANTHROPIC_WORKSPACE_ID}" ]; then
            echo "::error title=exit-test-fix-loop cannot run::the repository variable EXIT_TEST_ANTHROPIC_WORKSPACE_ID is empty. The key works only with the header anthropic-workspace-id."
            exit 1
          fi
          echo "the key and the workspace id are set"
      - name: Checkout gibson
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gibson

      # hosted is private, so the checkout needs the org read PAT.
      - name: Checkout hosted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zeroroot-ai/hosted
          path: hosted
          token: ${{ secrets.GH_PAT_PLATFORM_RO }}

      - name: Checkout charts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zeroroot-ai/charts
          ref: ${{ inputs.charts-ref || 'main' }}
          path: charts

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: gibson/go.mod
          cache-dependency-path: gibson/go.sum

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.2

      - name: Install kind + kubectl
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true

      - name: Install terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Raise the inotify limits
        uses: zeroroot-ai/.github/.github/actions/raise-inotify-limits@88cbc77697ff7143c98f29f3c4d80a93a666d601 # v0.23.0

      # The chart must hold the field of the CA bundle in the CRD. With none, the
      # API server drops the field, and the pod gets no bundle. The check runs
      # before the bring-up, so a wrong charts-ref fails in seconds with its name.
      - name: The CRD template of the chart holds caBundleSecret
        run: |
          set -euo pipefail
          crd=charts/helm/gibson-crds/templates/gibson.zeroroot.ai_connectorinstances.yaml
          if ! grep -Eq '^\s+caBundleSecret:' "$crd"; then
            echo "::error::$crd has no spec.caBundleSecret. Is charts-ref a chart with the field?"
            exit 1
          fi

      # The install patterns let the daemon accept the URL of the mock for the two
      # connectors. The platform owner of an install states them, and a tenant
      # never does.
      - name: Stand up the cluster with the images of the checkout and the mock forge
        id: cluster
        uses: ./gibson/.github/actions/aaif-exit-cluster
        with:
          ghcr-ro-pat: ${{ secrets.GHCR_RO_PAT }}
          with-kvm: "true"
          image-tag: fix-loop
          build-connector-operator: "true"
          connector-install-patterns: '{"github-fixloop/api_url":["https://forge.mock.example.com:8443"],"prometheus-health/base_url":["https://forge.mock.example.com:8443"]}'
          mock-forge-image: ${{ env.MOCK_FORGE_IMAGE }}

      - name: The fix loop exit test
        env:
          E2E_RUNNER_ENV_FILE: ${{ runner.temp }}/fix-loop.env
          E2E_RUNNER_EGRESS_INTERNET: "true"
          MOCK_URL: ${{ steps.cluster.outputs.mock-forge-url }}
          MOCK_CA_FILE: ${{ steps.cluster.outputs.mock-forge-ca-file }}
        run: |
          set -euo pipefail
          mkdir -p "$E2E_OUT"
          [ -n "$MOCK_URL" ] && [ -s "$MOCK_CA_FILE" ] || { echo "::error::the action gave no mock forge"; exit 1; }
          {
            printf 'FIXLOOP_MOCK_URL=%s\n' "$MOCK_URL"
            printf 'FIXLOOP_MOCK_CA_B64=%s\n' "$(base64 -w0 "$MOCK_CA_FILE")"
            printf 'EXIT_TEST_ANTHROPIC_API_KEY=%s\n' "$EXIT_TEST_ANTHROPIC_API_KEY"
            printf 'EXIT_TEST_ANTHROPIC_WORKSPACE_ID=%s\n' "$EXIT_TEST_ANTHROPIC_WORKSPACE_ID"
          } > "$E2E_RUNNER_ENV_FILE"
          # The test disables both connectors in its cleanup, so a later step
          # sees no connector pod. Record the tenant namespace once a minute
          # while the test runs. The full record is the artifact file
          # tenant-watch.log. The Diagnostics step prints only its end.
          # The artifact is public and GitHub masks nothing in it, so the
          # tenant namespace of this test must hold only mock credentials.
          watch_tenant() {
            while sleep 60; do
              {
                echo "=== $(date -u +%FT%TZ)"
                kubectl -n "$TENANT_NS" get mcpservers,connectorinstances,deploy,pods -o wide
                kubectl -n "$TENANT_NS" get events --sort-by=.lastTimestamp | tail -n 30
                for pod in $(kubectl -n "$TENANT_NS" get pods -o name); do
                  kubectl -n "$TENANT_NS" get "$pod" \
                    -o jsonpath='{.metadata.name}{" "}{range .status.containerStatuses[*]}{.name}={.ready}/{.state}{" "}{end}{"\n"}'
                  kubectl -n "$TENANT_NS" logs "$pod" --all-containers --since=65s --prefix
                  if [ "$(kubectl -n "$TENANT_NS" get "$pod" -o jsonpath='{.status.containerStatuses[*].restartCount}' | tr -d ' 0')" != "" ]; then
                    kubectl -n "$TENANT_NS" logs "$pod" --all-containers --previous --tail=50 --prefix
                  fi
                done
              } >> "$E2E_OUT/tenant-watch.log" 2>&1 || true
            done
          }
          # A bank member runs in a sandbox of setec. Its namespace has the label
          # setec.zeroroot.ai/sandbox-namespace, and its pod ends with the cluster
          # in a few minutes. Record these namespaces and setec-system every 20
          # seconds. The record holds the status and the events of each pod, and
          # never the spec, because the spec holds the key of the member. The
          # log lines pass through a filter that hides an Anthropic key.
          # The full record is the artifact file sandbox-watch.log.
          hide_keys() { sed -E 's/sk-ant-[A-Za-z0-9_-]+/sk-ant-HIDDEN/g'; }
          watch_sandboxes() {
            while sleep 20; do
              {
                echo "=== $(date -u +%FT%TZ)"
                kubectl get sandboxes.setec.zeroroot.ai -A -o wide
                kubectl -n setec-system get pods -o wide
                kubectl -n setec-system get events --sort-by=.lastTimestamp | tail -n 15
                for ns in $(kubectl get ns -l setec.zeroroot.ai/sandbox-namespace -o name | cut -d/ -f2); do
                  echo "--- namespace $ns"
                  kubectl -n "$ns" get pods -o wide
                  kubectl -n "$ns" get events --sort-by=.lastTimestamp | tail -n 30
                  for pod in $(kubectl -n "$ns" get pods -o name); do
                    kubectl -n "$ns" get "$pod" -o jsonpath='{.metadata.name}{" phase="}{.status.phase}{" "}{range .status.conditions[*]}{.type}={.status}/{.reason} {end}{range .status.containerStatuses[*]}{.name}={.ready}/{.state} {end}{"\n"}'
                    kubectl -n "$ns" logs "$pod" --all-containers --since=25s --prefix 2>&1 | hide_keys
                  done
                done
                for pod in $(kubectl -n setec-system get pods -o name); do
                  kubectl -n setec-system logs "$pod" --all-containers --since=25s --prefix 2>&1 | tail -n 40 | hide_keys
                done
              } >> "$E2E_OUT/sandbox-watch.log" 2>&1 || true
            done
          }
          watch_tenant &
          watcher=$!
          watch_sandboxes &
          sandbox_watcher=$!
          trap 'kill "$watcher" "$sandbox_watcher" 2>/dev/null || true' EXIT
          gibson/.github/scripts/run-e2e-job.sh gibson-e2e-fix-loop 'TestFixLoop$' 250m \
            2>&1 | tee "$E2E_OUT/fix-loop.log"

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fix-loop-${{ github.run_id }}
          path: ${{ github.workspace }}/e2e-out
          if-no-files-found: ignore

      - name: Argo bringup diagnostics
        if: always()
        working-directory: gibson
        run: bash scripts/ci/dump-bringup-diagnostics.sh

      - name: Diagnostics
        if: always()
        run: |
          kubectl get connectorinstances -A -o yaml | tail -n 200 || true
          kubectl -n gibson logs deploy/gibson-connector-operator --tail=300 || true
          kubectl -n "$NS" logs -l app.kubernetes.io/component=daemon -c gibson --tail=3000 \
            | grep -iE 'connector|fix-loop|fixloop' | tail -150 || true
          docker logs mock-forge --tail=100 || true
          for d in $(kubectl -n toolhive-system get deploy -o name); do
            kubectl -n toolhive-system logs "$d" --tail=200 || true
          done
          tail -n 400 "$E2E_OUT/tenant-watch.log" || true
          tail -n 400 "$E2E_OUT/sandbox-watch.log" || true
