# Caller workflow for the org tree guards. Copy to
# .github/workflows/tree-guards.yml in any repository.
#
#   brand-guard        fails on a retired brand string anywhere in the tracked tree
#   link-check         fails on a broken link in any Markdown file
#   exit-tests-off-pr  fails when an exit-test workflow has a pull request or
#                      merge queue trigger, or has no schedule (ADR-0080)
#
# The reusables live in zeroroot-ai/.github. Neither needs a secret: the
# checkout uses the calling repository's own GITHUB_TOKEN, and the scanners
# travel with the composite actions.
#
# The merge_group trigger is not optional on a repository with a merge queue. A
# required status check that never runs on merge_group stalls the queue until
# it times out, and every check in rulesets/repo/<repo>.json is required in
# both lanes.
#
# Per-repo exemptions:
#   .brand-guard-allow  repo-relative paths under a `# why:` comment
#   .lychee.toml        adds to the org link policy, never replaces it

name: tree-guards

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: tree-guards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  brand-guard:
    uses: zeroroot-ai/.github/.github/workflows/brand-guard.yml@40c67fd77152f2c4924abccbd992dbca065f325b # v0.8.2

  link-check:
    uses: zeroroot-ai/.github/.github/workflows/link-check.yml@f2ca779edd5461be94bdd0a0762657f85317983e # v0.7.2

  exit-tests-off-pr:
    uses: zeroroot-ai/.github/.github/workflows/exit-tests-off-pr.yml@53a2406de391869c35d5cf5b851a21b80185ff48 # v0.14.0
