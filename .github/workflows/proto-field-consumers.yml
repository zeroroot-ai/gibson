# ----------------------------------------------------------------------------
# proto-field-consumers — every daemon-owned proto field has a consumer.
#
# ADR-0094 layer 5 (gibson#502). The merge gate runs the same scan in go-ci
# (critical-paths job, gibson#1166). This workflow keeps the on-demand run,
# because a consumer that drops its last read of a field changes nothing in
# this repo, so only a run on dispatch sees it between gibson PRs. A push to main that changes a proto file also runs it.
#
# Every consumer is public, so the default token reads them all. A private
# consumer would need GH_PAT_PLATFORM_RO like the exit tests use for hosted.
# ----------------------------------------------------------------------------
name: proto-field-consumers

on:
  push:
    branches: [main]
    paths:
      - 'internal/server/daemon/api/**/*.proto'
      - 'scripts/check-proto-field-consumers.sh'
      - 'scripts/proto-field-consumers-exempt.txt'
      - 'scripts/proto-field-consumer-roots.sh'
      - '.proto-consumer-ref'
      - 'tools/protofieldreads/**'
      - '.github/workflows/proto-field-consumers.yml'
  workflow_dispatch: {}

concurrency:
  group: proto-field-consumers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout gibson
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gibson

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: gibson/go.mod
          cache-dependency-path: gibson/go.sum

      - name: Every served proto field has a consumer or a recorded verdict
        working-directory: gibson
        run: |
          bash scripts/__tests__/check-proto-field-consumers.test.sh
          bash scripts/__tests__/proto-field-consumer-roots.test.sh
          # Each consumer at its main, or at the one branch that
          # .proto-consumer-ref names. The script fails when a clone fails.
          roots="$(PROTO_CONSUMERS_REMOTE="https://x-access-token:${GH_TOKEN}@github.com/zeroroot-ai" \
            bash scripts/proto-field-consumer-roots.sh "$RUNNER_TEMP/consumers")"
          CONSUMER_ROOTS="$roots" bash scripts/check-proto-field-consumers.sh
        env:
          GH_TOKEN: ${{ github.token }}
