# ----------------------------------------------------------------------------
# ADR-0016 sandboxed platform-agent dispatch — the exit test (epic gibson#1593,
# slice gibson#1600).
#
# In plain words: on a real gvisor cluster, an ENABLED tenant that dispatches
# the platform agent `zerocool` runs it in an EPHEMERAL sandbox that is torn
# down afterwards; a tenant that never enabled it is DENIED; and the live
# console shows a tenant only its OWN running instances.
#
# WHAT THIS PROVES vs. the hosted vanilla-install exit test. hosted's
# exit-test-vanilla-install proves the SANCTIONED PROFILE installs (setec +
# gvisor + the daemon come up on a cloud-free cluster, authz ON). This proves
# the DISPATCH ISOLATION LOGIC end to end: the enablement gate, the ephemeral
# sandbox lifecycle, and the tenant-scoped console. Driving those needs
# authenticated gRPC against the daemon, which in the shipped profile only
# arrives via Envoy + ext-authz. So this test brings up the SAME setec+gvisor
# runtime but with a TEST-MODE daemon (authz disabled, GIBSON_TEST_FIXTURES,
# built `-tags="setec_integration test_fixtures"`) so the suite can dial the
# daemon directly — the test-mode model every cluster-bound e2e suite uses.
# Authentication itself is covered by login_full_chain / auth e2e, not here.
#
# ADR-0012: NEVER on pull_request. An exit test measures state on `main` for the
# launch scorecard; it needs a live cluster, so it cannot gate a PR. The merge
# gate is the ten-minute set in go-ci.yml.
# ----------------------------------------------------------------------------
name: exit-test-sandboxed-dispatch

on:
  push:
    branches: [main]
    paths:
      - 'internal/engine/harness/**'
      - 'internal/platform/componentcatalog/**'
      - 'internal/server/daemon/**'
      - 'tests/e2e/sandboxed_agent_dispatch_test.go'
      - 'tests/e2e/helpers/**'
      - '.github/workflows/exit-test-sandboxed-dispatch.yml'
  schedule:
    # Daily. A dispatch path that isolates today and not tomorrow is the failure
    # this catches; nothing else exercises it on a real gvisor cluster.
    - cron: '0 5 * * *'
  workflow_dispatch: {}

concurrency:
  group: exit-test-sandboxed-dispatch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # hosted's recreate renders the chart from a checkout of zeroroot-ai/charts.
  CHARTS_ROOT: ${{ github.workspace }}/charts
  NS: gibson
  RELEASE: gibson
  CLUSTER: vanilla
  # The kind node the hosted bring-up creates (vanilla-up.sh: <cluster>-control-plane).
  NODE: vanilla-control-plane

jobs:
  dispatch-isolation:
    name: sandboxed dispatch isolates by tenant on gvisor
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout gibson
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gibson

      # The kind bring-up (make substrate / make recreate ENV=kind), the
      # sanctioned setec+gvisor profile and the gvisor node-prep live in the
      # hosted repo since the 2026-09-04 split (ADR-0086; deploy and gitops
      # were deleted). Reuse them rather than re-implementing the cluster in
      # this file (ONE bring-up path). hosted is private, so the checkout
      # needs the org read PAT; the default GITHUB_TOKEN cannot read it.
      - name: Checkout hosted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zeroroot-ai/hosted
          path: hosted
          token: ${{ secrets.GH_PAT_PLATFORM_RO }}

      # The chart source lives in zeroroot-ai/charts (ADR-0086); hosted holds
      # none and its recreate reads CHARTS_ROOT. charts is public.
      - name: Checkout charts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zeroroot-ai/charts
          path: charts

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: gibson/go.mod
          cache-dependency-path: gibson/go.sum

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.2

      - name: Install kind + kubectl
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true

      # `make recreate ENV=kind` runs stage 1 through terraform (deploy#1776,
      # scripts/recreate-kind.sh:203). The deleted `vanilla-fresh` did not, so
      # nothing here installed it and every exit test died with
      # "terraform is not on PATH" (run 33675016607). Pinned to hosted's own CI
      # version; kind/gibson requires >= 1.9.
      - name: Install terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      # Stage 0 writes the bringup keyring the install reads (ADR-0015,
      # deploy#1730, deploy#1732). The registry pull token is the keyring
      # member GHCR_PULL_TOKEN now; vanilla-up.sh refuses the environment
      # variable it used to take, so there is one path and no second one. The
      # state dir is the runner's temp, because nothing here owns /bulk.
      - name: Stage 0, the substrate and the bringup keyring
        working-directory: hosted
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_RO_PAT }}
        run: |
          if [ -z "${GHCR_PULL_TOKEN}" ]; then
            echo "::error::GHCR_RO_PAT is required to pull first-party images (daemon, setec)."
            exit 1
          fi
          SUBSTRATE_DIR="$RUNNER_TEMP/substrate" make substrate ENV=kind

      # Stand up kind with the sanctioned setec+gvisor profile. vanilla-up.sh
      # --fresh-kind does the gvisor node-prep (runsc install + the containerd
      # runsc handler) and installs the umbrella with values-vanilla.yaml, which
      # now carries setec+gvisor+dispatch. The 2-core overlay shrinks REQUESTS so
      # the whole platform packs onto the runner.
      - name: Stand up the setec+gvisor cluster
        working-directory: hosted
        run: |
          SUBSTRATE_DIR="$RUNNER_TEMP/substrate" \
            EXTRA_VALUES=test/vanilla/ci-2core-resources.values.yaml make recreate ENV=kind

      # The node must actually advertise gvisor, or every sandbox stays Pending.
      # This is the gvisor node-prep assertion, kept explicit so a node-prep
      # regression fails HERE with a clear message, not as a mystery timeout.
      - name: Node advertises gvisor
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            v=$(kubectl get node "$NODE" -o jsonpath='{.metadata.labels.setec\.zeroroot\.ai/runtime\.gvisor}' 2>/dev/null || true)
            [ "$v" = "true" ] && { echo "node advertises runtime.gvisor=true"; break; }
            sleep 5
          done
          v=$(kubectl get node "$NODE" -o jsonpath='{.metadata.labels.setec\.zeroroot\.ai/runtime\.gvisor}' 2>/dev/null || true)
          if [ "$v" != "true" ]; then
            echo "::error::node does not advertise runtime.gvisor=true — gvisor node-prep failed (runsc binary or the containerd io.containerd.cri.v1.runtime handler is missing)"
            kubectl -n setec-system logs -l app.kubernetes.io/component=runtime-agent --tail=40 || true
            exit 1
          fi

      # Swap in a TEST-MODE daemon so the e2e suite can dial gRPC directly:
      # authz disabled (no Envoy/ext-authz in the test), test fixtures on, and
      # built with setec_integration so DelegateToAgent reaches the real setec
      # launcher. This is the same test-mode contract the other e2e suites rely
      # on; it changes ONLY how the client authenticates, never the setec+gvisor
      # runtime under test.
      # The overlay below builds FROM the private daemon image on ghcr.io.
      # The cluster pulls it with the keyring's pull token, but the runner's
      # own docker has no credential and gets 401 (run 33643826807). Log it in
      # with the same read-only token, so one token serves both.
      - name: Log the runner's docker in to ghcr.io
        env:
          GHCR_RO_PAT: ${{ secrets.GHCR_RO_PAT }}
        run: echo "$GHCR_RO_PAT" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build + load the test-mode daemon
        working-directory: gibson
        run: |
          set -euo pipefail
          # The base image is the daemon image the sanctioned install already
          # pulled onto the node — overlay the test-tagged binary onto it so all
          # the daemon's baked-in assets stay in place. Discover that reference
          # from the running StatefulSet rather than hardcoding a tag.
          BASE=$(kubectl -n "$NS" get statefulset -l app.kubernetes.io/component=daemon \
            -o jsonpath='{.items[0].spec.template.spec.containers[?(@.name=="gibson")].image}')
          echo "overlaying onto base daemon image: ${BASE}"
          mkdir -p /tmp/dctx
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -tags="setec_integration test_fixtures" \
            -ldflags="-s -w -X github.com/zeroroot-ai/gibson/pkg/version.GitCommit=$(git rev-parse --short HEAD)" \
            -o /tmp/dctx/gibson ./cmd/gibson
          cat > /tmp/dctx/Dockerfile <<EOF
          FROM ${BASE}
          COPY gibson /usr/local/bin/gibson
          EOF
          docker build -t ghcr.io/zeroroot-ai/gibson:e2e-dispatch /tmp/dctx
          kind load docker-image ghcr.io/zeroroot-ai/gibson:e2e-dispatch --name "$CLUSTER"

      - name: Point the daemon at the test-mode image with authz off + fixtures on
        working-directory: hosted
        run: |
          set -euo pipefail
          # The platform is an Argo Application now (deploy#1776), not a helm
          # release, so `helm upgrade` fails with `"gibson" has no deployed
          # releases`, and syncPolicy.automated.selfHeal would revert a manual
          # release anyway. The override is a patch to the Application's helm
          # parameters; Argo is the one that applies it.
          #
          # A json `add` to `parameters/-` APPENDS. A merge patch would replace
          # the whole list and drop the six the bringup set (postgres recovery,
          # the bucket, the pinned envoy ClusterIP), which would break the
          # cluster rather than retarget it.
          # The e2e runner is a mesh peer: the e2eRunner values mint its SVID and
          # allow-list it on the daemon's gRPC listener, which refuses plaintext
          # (zero-trust-hardening Req 1.2). Same shape as exit-test-bank.
          kubectl -n argocd patch application gibson --type json -p '[
              {"op":"add","path":"/spec/source/helm/values","value":"gibson-workloads:\n  gibson:\n    e2eRunner:\n      enabled: true\n    auth:\n      spiffe:\n        allowedPeerIDs:\n          - spiffe://zeroroot.ai/platform/tenant-operator\n          - spiffe://zeroroot.ai/platform/connector-operator\n          - spiffe://zeroroot.ai/platform/e2e-runner\n"},
              {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.gibson.image.repository","value":"ghcr.io/zeroroot-ai/gibson","forceString":true}},
              {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.gibson.image.tag","value":"e2e-dispatch","forceString":true}},
              {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.gibson.image.pullPolicy","value":"IfNotPresent","forceString":true}},
              {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.gibson.authz.enabled","value":"false"}},
              {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.gibson.extraEnv.GIBSON_TEST_FIXTURES_ENABLED","value":"true","forceString":true}}
            ]'

          # Argo reconciles the spec change; wait for the StatefulSet to carry
          # the test image before asking for a rollout, so `rollout status`
          # cannot pass against the pre-patch generation.
          for i in $(seq 1 60); do
            img=$(kubectl -n "$NS" get statefulset -l app.kubernetes.io/component=daemon \
                    -o jsonpath='{.items[0].spec.template.spec.containers[?(@.name=="gibson")].image}' 2>/dev/null || true)
            case "$img" in *:e2e-dispatch) echo "daemon image is $img"; break;; esac
            [ "$i" = 60 ] && { echo "::error::the daemon StatefulSet never took the e2e-dispatch image (Argo app: $(kubectl -n argocd get app gibson -o jsonpath='{.status.sync.status}/{.status.health.status}'))"; exit 1; }
            sleep 20
          done
          kubectl -n "$NS" rollout status statefulset -l app.kubernetes.io/component=daemon --timeout=20m
          # Confirm the daemon wired the sandboxed AGENT launcher — the linchpin.
          #
          # NEVER `kubectl ... | grep -q` under `set -o pipefail`: grep -q exits
          # on the first match, kubectl then dies of SIGPIPE, and pipefail
          # reports the PIPELINE as failed even though the match succeeded. That
          # is why this check could never pass. Runs 33687066349 and 33691480645
          # both declared the line missing while the failure dump printed it,
          # from the same command, microseconds later. Read the log into a
          # variable and match on the string.
          #
          # Poll as well: `rollout status` returns when the Pod is Ready and the
          # daemon writes this line a few seconds later, while it builds the
          # harness.
          for i in $(seq 1 30); do
            logs=$(kubectl -n "$NS" logs -l app.kubernetes.io/component=daemon -c gibson --tail=400 2>/dev/null || true)
            case "$logs" in
              *"sandboxed agent launcher wired"*) echo "daemon wired the sandboxed agent launcher"; break ;;
            esac
            if [ "$i" -eq 30 ]; then
              echo "::error::daemon did not wire the sandboxed agent launcher within 5m (check sandbox.enabled + agent_sandbox_class)"
              printf '%s\n' "$logs"
              exit 1
            fi
            sleep 10
          done

      # The daemon's gRPC listener speaks SPIFFE mTLS and refuses plaintext, so
      # the suite cannot dial it over a port-forward from the runner (it did:
      # "error reading server preface: EOF"). It runs in-cluster as a Job under
      # the e2e-runner ServiceAccount with the SPIRE socket mounted, the same
      # shape as exit-test-tool-dispatch and exit-test-bank.
      - name: Build the e2e suite into an image
        working-directory: gibson
        run: |
          set -euo pipefail
          mkdir -p /tmp/ectx
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test -tags=e2e -c \
            -o /tmp/ectx/e2e.test ./tests/e2e/
          cat > /tmp/ectx/Dockerfile <<'EOF'
          FROM gcr.io/distroless/static-debian12:nonroot
          COPY e2e.test /usr/local/bin/e2e.test
          ENTRYPOINT ["/usr/local/bin/e2e.test"]
          EOF
          docker build -t ghcr.io/zeroroot-ai/gibson-e2e-runner:local /tmp/ectx
          kind load docker-image ghcr.io/zeroroot-ai/gibson-e2e-runner:local --name "$CLUSTER"

      - name: Run the sandboxed-dispatch exit test in-cluster
        run: |
          set -euo pipefail
          pw=$(kubectl -n "$NS" get secret gibson-redis-stack -o jsonpath='{.data.redis-password}' | base64 -d)
          if [ -z "$pw" ]; then
            echo "::error::gibson-redis-stack has no redis-password; the fixture helpers cannot authenticate"
            exit 1
          fi
          echo "::add-mask::$pw"
          kubectl -n "$NS" delete secret gibson-e2e-runner-env --ignore-not-found
          kubectl -n "$NS" create secret generic gibson-e2e-runner-env \
            --from-literal=REDIS_PASSWORD="$pw"

          kubectl -n "$NS" delete job gibson-e2e-sandboxed-dispatch --ignore-not-found
          cat <<EOF | kubectl -n "$NS" apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: gibson-e2e-sandboxed-dispatch
          spec:
            backoffLimit: 0
            template:
              metadata:
                labels:
                  app.kubernetes.io/component: e2e-runner
              spec:
                restartPolicy: Never
                serviceAccountName: ${RELEASE}-e2e-runner
                containers:
                  - name: e2e
                    image: ghcr.io/zeroroot-ai/gibson-e2e-runner:local
                    imagePullPolicy: IfNotPresent
                    args: ["-test.run", "TestSandboxedAgentDispatch", "-test.v", "-test.timeout", "20m"]
                    env:
                      - name: GIBSON_TEST_FIXTURES_ENABLED
                        value: "true"
                      - name: DAEMON_GRPC_ADDR
                        value: "gibson-gibson-workloads.${NS}.svc.cluster.local:50051"
                      - name: REDIS_ADDR
                        value: "gibson-redis-stack.${NS}.svc.cluster.local:6379"
                      - name: REDIS_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: gibson-e2e-runner-env
                            key: REDIS_PASSWORD
                    volumeMounts:
                      - name: spire-agent-socket
                        mountPath: /run/spire/sockets
                        readOnly: true
                volumes:
                  - name: spire-agent-socket
                    csi:
                      driver: csi.spiffe.io
                      readOnly: true
          EOF

          kubectl -n "$NS" wait --for=condition=Ready pod \
            -l job-name=gibson-e2e-sandboxed-dispatch --timeout=3m || true
          kubectl -n "$NS" logs -f job/gibson-e2e-sandboxed-dispatch --tail=-1 || true

          for _ in $(seq 1 120); do
            ok=$(kubectl -n "$NS" get job gibson-e2e-sandboxed-dispatch -o jsonpath='{.status.succeeded}' 2>/dev/null || true)
            bad=$(kubectl -n "$NS" get job gibson-e2e-sandboxed-dispatch -o jsonpath='{.status.failed}' 2>/dev/null || true)
            [ "${ok:-0}" != "0" ] && [ -n "${ok:-}" ] && { echo "exit test PASSED"; exit 0; }
            [ "${bad:-0}" != "0" ] && [ -n "${bad:-}" ] && { echo "::error::the sandboxed-dispatch exit test FAILED"; exit 1; }
            sleep 10
          done
          echo "::error::the sandboxed-dispatch exit test did not finish"
          exit 1

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NS" get pods || true
          kubectl -n setec-system get pods,sandboxes,sandboxclasses || true
          kubectl -n setec-sandboxes get pods || true
          kubectl -n "$NS" logs -l app.kubernetes.io/component=daemon -c gibson --tail=200 || true
