name: gibson-images

# Collapses gibson's six independent image-build workflows into ONE matrix
# workflow (Epic: cicd-efficiency, board #44, slice S4, gibson#1129). See
# docs/architecture/CICD-CONTEXT.md decision #8 and
# docs/adr/0060-ci-runner-split-hosted-default-ephemeral-metal.md.
#
# Superseded workflows (deleted by this change):
#   - build.yaml                        (its image-build portion; the
#                                        embedded `test` job moved to
#                                        go-ci.yml's merge_group tier)
#   - gibson-daemon.yml
#   - gibson-component-images.yml
#   - gibson-bootstrap-image.yml
#   - gibson-bootstrap-runner-image.yml
#   - gibson-belief-sidecar.yml
#
# Trigger discipline (decision #8): push:main + push:v*.*.* tags (release-please
# cuts vX.Y.Z tags; reusable-image-build's `type=match,pattern=v(.*)` metadata
# rule derives the semver image tag from that tag push) + workflow_dispatch for
# manual backfill/force-rebuild, and for (re)publishing a specific tag that
# doesn't match `v*.*.*` (e.g. `gibson-bootstrap-v1.0.0`) by dispatching with
# `--ref <tag>`, e.g. `gh workflow run gibson-images.yml --ref v1.2.3` -- the
# same escape hatch gibson-bootstrap-image.yml / gibson-bootstrap-runner-image.yml
# / gibson-belief-sidecar.yml already documented, now extended uniformly. NO
# `pull_request` trigger -- image builds no longer run on every PR push.
#
# All images build on every push to main (no per-component path filter): this
# keeps parity simple and correct regardless of which component's files
# changed, and slice S3's merge queue already bounds push:main frequency to
# one push per landed PR, so the matrix no longer fires per-push-per-workflow
# six times over.
#
# One checkout/buildx bootstrap per image job (the reusable's own steps), but
# ONE workflow definition/trigger surface and ONE `type=gha` cache backend
# call-site instead of six independently-triggered workflows -- this is what
# "one coherent cache scope" means here; the reusable
# (zeroroot-ai/.github/reusable-image-build.yml) does not expose a
# configurable `scope=` cache key, so per-image cache partitioning is
# unchanged, but the six duplicate trigger surfaces (and their independent
# checkout/free-disk-space/buildx-bootstrap overhead firing on every push) are
# gone.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Optional tag to (re)publish -- select it via the branch/tag dropdown
          or pass `--ref <tag>` to `gh workflow run` (e.g. v1.2.3,
          gibson-bootstrap-v1.0.0, gibson-bootstrap-runner-v1.0.0,
          gibson-belief-sidecar-v1.0.0). Informational: the actual ref built is
          whatever ref the dispatch runs against, not this input.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gibson-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- the eight interchangeable images: one matrix, one reusable call site ----
  #
  # First-party component images (ADR-0015 decision 9): a plugin / hosted
  # tool / hosted connector that gibson ships is added here as another matrix
  # entry with its own build/<name>.Dockerfile. The reusable workflow builds it
  # FROM SOURCE and cosign-signs it (keyless OIDC + SLSA attestation, the
  # id-token/attestations permissions below) — the same machinery as the daemon
  # and operators; no bespoke signer. Its catalog manifest then pins the built
  # image by digest, which `componentcatalog` enforces at load
  # (requireFirstPartyImageDigest). Agents ship no image (trusted in-image Go
  # code), and a third-party vendor image (any non-ghcr.io/zeroroot-ai registry)
  # is the vendor seam — not built or signed here.
  images:
    name: ${{ matrix.component }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: gibson
            dockerfile: Dockerfile
            path: .
            image: ghcr.io/zeroroot-ai/gibson
            tag_pattern: (v.*)
            # spec setec-sandbox-prod-default R1.1: production GHCR images
            # compile in the Setec gRPC adapter by default. COMMIT + BUILD_TIME
            # populate pkg/version.GitCommit / BuildTime via ldflags (gibson#251).
            build_args: |
              BUILD_TAGS=setec_integration
              COMMIT=${{ github.sha }}
              BUILD_TIME=${{ github.event.head_commit.timestamp }}
          - component: ext-authz
            dockerfile: build/ext-authz.Dockerfile
            path: .
            image: ghcr.io/zeroroot-ai/ext-authz
            tag_pattern: (v.*)
            build_args: ""
          - component: tenant-operator
            dockerfile: build/tenant-operator.Dockerfile
            path: .
            image: ghcr.io/zeroroot-ai/tenant-operator
            tag_pattern: (v.*)
            build_args: ""
          - component: connector-operator
            dockerfile: build/connector-operator.Dockerfile
            path: .
            image: ghcr.io/zeroroot-ai/connector-operator
            tag_pattern: (v.*)
            build_args: ""
          - component: platform-operator
            dockerfile: build/platform-operator.Dockerfile
            path: .
            image: ghcr.io/zeroroot-ai/platform-operator
            tag_pattern: (v.*)
            build_args: ""
          - component: spiffe-jwks-exporter
            dockerfile: build/spiffe-jwks-exporter.Dockerfile
            path: .
            image: ghcr.io/zeroroot-ai/spiffe-jwks-exporter
            tag_pattern: (v.*)
            build_args: ""
          - component: gibson-bootstrap
            dockerfile: tools/gibson-bootstrap/Dockerfile
            path: .
            image: ghcr.io/zeroroot-ai/gibson-bootstrap
            tag_pattern: gibson-bootstrap-v(.*)
            build_args: ""
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@cf1c48774b57e552ccdd17a2a4bba3f782587dbe # main, .github recreated 2026-09-06
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    with:
      component_name: ${{ matrix.component }}
      component_path: ${{ matrix.path }}
      dockerfile_path: ${{ matrix.dockerfile }}
      image_name: ${{ matrix.image }}
      tag_pattern: ${{ matrix.tag_pattern }}
      build_args: ${{ matrix.build_args }}

  # ---- gibson-bootstrap-runner: built AFTER gibson-bootstrap ---------------
  # Dockerfile.runner starts FROM ghcr.io/zeroroot-ai/gibson-bootstrap:latest,
  # the image the matrix above publishes. Inside the matrix the two built in
  # parallel and the runner only ever succeeded because an older :latest
  # already existed. With the package recreated from nothing (2026-09-06) the
  # race lost every time: "gibson-bootstrap:latest: not found". The runner is
  # its own job now and waits for the whole matrix.
  bootstrap-runner:
    name: gibson-bootstrap-runner
    needs: images
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@cf1c48774b57e552ccdd17a2a4bba3f782587dbe # main, .github recreated 2026-09-06
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    with:
      component_name: gibson-bootstrap-runner
      component_path: .
      dockerfile_path: tools/gibson-bootstrap/Dockerfile.runner
      image_name: ghcr.io/zeroroot-ai/gibson-bootstrap-runner
      tag_pattern: gibson-bootstrap-runner-v(.*)
      build_args: ""

  # ---- gibson-belief-sidecar: kept as its own job (distinct pytest gate) ----
  # The image build never runs the container and the inference import is lazy,
  # so nothing else would catch a sidecar that cannot construct a BeliefModel --
  # which is exactly how the gibson#982 startup ImportError shipped. Gating the
  # image build on this job makes a runtime-broken sidecar un-publishable. Kept
  # out of the `images` matrix so a sidecar test failure never blocks the other
  # seven (unrelated) images from publishing.
  #
  # test_model.py used to guard its inference tests with pytest.importorskip
  # ("pgmpy"), which meant they skipped silently anywhere pgmpy was absent.
  # Inference no longer needs pgmpy at all (gibson#1436), so those guards are
  # gone and the tests always run. The one place pgmpy is still needed is
  # test_parity.py, which proves the numpy engine agrees with the pgmpy one it
  # replaced -- that gets its own step with requirements-dev.txt, installed
  # AFTER the runtime step so a torch in site-packages can never make the
  # runtime tests pass by accident.
  belief-sidecar-test:
    # Defined in .github/workflows/belief-sidecar.yml so the identical job also
    # runs on pull requests. It cannot live here: this workflow triggers only on
    # `push: main`, tags and dispatch, so a job defined here is invisible on a
    # PR -- and sidecar/belief is Python, which no go-ci lane compiles. Calling
    # it keeps it as the publish gate as well.
    uses: ./.github/workflows/belief-sidecar.yml

  belief-sidecar-image:
    name: gibson-belief-sidecar
    needs: belief-sidecar-test
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@cf1c48774b57e552ccdd17a2a4bba3f782587dbe # main, .github recreated 2026-09-06
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    with:
      component_name: gibson-belief-sidecar
      component_path: sidecar/belief
      dockerfile_path: sidecar/belief/Dockerfile
      image_name: ghcr.io/zeroroot-ai/gibson-belief-sidecar
      tag_pattern: gibson-belief-sidecar-(v.*)
    # Self-contained Python (pinned public deps in requirements.txt).
