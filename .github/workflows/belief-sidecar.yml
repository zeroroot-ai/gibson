name: belief-sidecar
# Python tests for sidecar/belief.
#
# Why this is its own workflow rather than a job in gibson-images.yml: that
# workflow triggers only on `push: main`, tags and dispatch, so a job living
# there never appears on a pull request. The sidecar is the one component in
# this repo that go-ci.yml does not compile — it is Python — so before this
# file existed, a change to sidecar/belief reached `main` with **no gate having
# run on the PR at all**, and only then hit the publish gate. That is the same
# invisible-gate failure mode as gibson#1233, just in the other direction.
#
# The job is defined once here and consumed twice:
#   - `pull_request` (path-filtered) — the PR-visible gate.
#   - `workflow_call` — gibson-images.yml calls it as the publish gate, so a
#     sidecar that fails its tests is still un-publishable.
#
# lane-exception: not run on `merge_group`. The tests are scoped to a single
# directory that no Go lane compiles, and running them in the queue would
# install torch (the pgmpy reference implementation, ~3 GB) on every queue
# entry in the repo rather than only on the rare PR that touches this
# directory. Absence from the queue lane is made visible by the fact that the
# identical workflow runs again via gibson-images.yml on `push: main` before
# any image is published — a regression that slipped the queue blocks the
# publish rather than shipping.

on:
  pull_request:
    paths:
      - 'sidecar/belief/**'
      - '.github/workflows/belief-sidecar.yml'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: belief-sidecar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          # Must track the sidecar's runtime base (distroless/python3-debian13
          # is CPython 3.13). Testing on a different minor than we ship is how a
          # version-specific break reaches production green.
          python-version: "3.13"

      - name: Install runtime deps + pytest
        working-directory: sidecar/belief
        run: |
          pip install --require-hashes -r requirements.txt
          pip install pytest

      # Runs with the runtime dependency set and nothing else, so it also
      # proves the shipped image's dependency closure is sufficient. The
      # inference tests used to be guarded by pytest.importorskip("pgmpy") and
      # therefore skipped silently here; inference no longer needs pgmpy, the
      # guards are gone, and test_infer.py asserts no heavy library is even
      # importable in this environment (gibson#1436).
      - name: Unit + exact-inference tests (runtime dependency set only)
        working-directory: sidecar/belief
        run: python -m pytest test_model.py test_infer.py -q

      # Deliberately after the step above: installing pgmpy pulls torch, numpy's
      # transitive friends and a great deal else into site-packages. Doing it
      # first would let the runtime tests pass on a dependency the image does
      # not ship.
      - name: Install the pgmpy reference implementation (dev-only, never shipped)
        working-directory: sidecar/belief
        run: pip install -r requirements-dev.txt

      - name: Parity against pgmpy 0.1.26
        working-directory: sidecar/belief
        run: python -m pytest test_parity.py -q
