# ----------------------------------------------------------------------------
# The finding evidence exit test (epic gibson#1384).
#
# In plain words: a finding holds all of its evidence in one shape. Evidence that
# names a tool call that the daemon recorded is tier 1, and the daemon copies the
# result from its own record. Evidence that the agent typed is tier 2. An agent
# cannot type a tier 1 item, and it cannot name the tool call of another mission.
#
# The steps:
#   1. The kind bring-up of the AAIF exit tests (the action aaif-exit-cluster).
#   2. TestFindingEvidence runs in the cluster as a Job. The suite serves an outside
#      agent and an outside tool, so it needs no sandbox and no model.
#
# Points 6 and the parser finding are not covered. See the comment of
# tests/e2e/finding_evidence_test.go.
#
# ADR-0080: NEVER on pull_request and never on a schedule. It needs a live cluster.
# It runs on main and on dispatch.
# ----------------------------------------------------------------------------
name: exit-test-finding-evidence

on:
  push:
    branches: [main]
    paths:
      - 'internal/platform/component/finding_submitter.go'
      - 'internal/platform/component/service.go'
      - 'internal/engine/brain/**'
      - 'internal/engine/finding/**'
      - 'internal/engine/graphrag/ingest/**'
      - 'internal/server/daemon/api/get_finding*.go'
      - 'internal/server/daemon/api/export_findings.go'
      - 'tests/e2e/finding_evidence_test.go'
      - 'tests/e2e/helpers/**'
      - '.github/actions/aaif-exit-cluster/**'
      - '.github/scripts/run-e2e-job.sh'
      - '.github/workflows/exit-test-finding-evidence.yml'
  workflow_dispatch:
    inputs:
      charts-ref:
        description: The ref of zeroroot-ai/charts to install. Use epic/aaif-alignment until it merges.
        required: false
        default: main

# One run at a time, and a run that started finishes (gibson#151).
concurrency:
  group: exit-test-finding-evidence-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CHARTS_ROOT: ${{ github.workspace }}/charts
  NS: gibson
  RELEASE: gibson
  CLUSTER: gibson
  NODE: gibson-control-plane
  E2E_OUT: ${{ github.workspace }}/e2e-out


jobs:
  finding-evidence:
    name: a finding holds the recorded result of a tool call as tier 1 evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout gibson
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gibson

      # hosted is private, so the checkout needs the org read PAT.
      - name: Checkout hosted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zeroroot-ai/hosted
          path: hosted
          token: ${{ secrets.GH_PAT_PLATFORM_RO }}

      - name: Checkout charts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zeroroot-ai/charts
          ref: ${{ inputs.charts-ref || 'main' }}
          path: charts

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v5
        with:
          go-version-file: gibson/go.mod
          cache-dependency-path: gibson/go.sum

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v3.16.2

      - name: Install kind + kubectl
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          install_only: true

      - name: Install terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      # A full platform on kind opens more inotify instances than the runner
      # allows. The limits go up before the cluster starts (gibson#1331).
      - name: Raise the inotify limits
        uses: zeroroot-ai/.github/.github/actions/raise-inotify-limits@88cbc77697ff7143c98f29f3c4d80a93a666d601 # v0.23.0

      - name: Stand up the cluster with the images of the checkout
        uses: ./gibson/.github/actions/aaif-exit-cluster
        with:
          ghcr-ro-pat: ${{ secrets.GHCR_RO_PAT }}
          with-kvm: "false"
          image-tag: aaif-evidence

      - name: The finding evidence exit test
        run: |
          set -o pipefail
          mkdir -p "$E2E_OUT"
          gibson/.github/scripts/run-e2e-job.sh gibson-e2e-finding-evidence 'TestFindingEvidence$' 25m \
            2>&1 | tee "$E2E_OUT/finding-evidence.log"

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: finding-evidence-${{ github.run_id }}
          path: ${{ github.workspace }}/e2e-out
          if-no-files-found: ignore

      # always(), not failure(): a job that hits timeout-minutes is cancelled,
      # and a cancelled job skips failure() steps.
      - name: Argo bringup diagnostics
        if: always()
        working-directory: gibson
        run: bash scripts/ci/dump-bringup-diagnostics.sh

      - name: Diagnostics
        if: always()
        run: |
          kubectl -n "$NS" get pods || true
          kubectl -n "$NS" logs -l app.kubernetes.io/component=daemon -c gibson --tail=5000 \
            | grep -iE 'finding|evidence|tool call|mission' \
            | tail -200 || true
