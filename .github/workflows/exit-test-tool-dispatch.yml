# ----------------------------------------------------------------------------
# ADR-0017 manifest-seeded TOOL dispatch — the exit test (slice gibson#1659).
#
# In plain words: a tenant that switched a tool on can run it, a tenant that
# never did cannot, and nobody can run a tool that is not in the catalog.
#
# WHAT THIS PROVES vs. the other exit tests. hosted's exit-test-baseline-install
# proves the SANCTIONED PROFILE installs. exit-test-sandboxed-dispatch proves
# AGENT dispatch isolation. This proves the TOOL half of ADR-0017: the catalog
# manifest is the single source of truth for a tool's runtime shape, and the
# per-tenant can_execute gate (gibson#1638) decides every dispatch.
#
# It matters because until ADR-0017 a tool could reach dispatch two ways — the
# manifest path, and a runtime catalog refresher whose `_system` registry
# entries dispatched with NO per-tenant check. That refresher is deleted
# (gibson#1641, ADR-0027 hard cutover); this test fails if a second, ungated
# path ever comes back.
#
# Driving the decision needs authenticated gRPC against the daemon, which in the
# shipped profile only arrives via Envoy + ext-authz. So this brings up the SAME
# setec+gvisor runtime but with a TEST-MODE daemon (authz disabled,
# GIBSON_TEST_FIXTURES, built `-tags="setec_integration test_fixtures"`) so the
# suite can dial the daemon directly — the model exit-test-sandboxed-dispatch.yml
# already uses. Authentication itself is
# covered by login_full_chain / auth e2e, not here.
#
# The same cluster also hosts the PLUGIN SECRET REVOCATION exit test
# (gibson#154): the GitHub plugin image runs beside Envoy, the suite revokes
# its secret, and the install must read Degraded within one heartbeat plus the
# event stream's latency. It needs Envoy, ext-authz, SPIRE and the test-mode
# daemon, all of which stand here, so it is a step after the tool test rather
# than a second 45-minute bring-up.
#
# ADR-0012: NEVER on pull_request. An exit test measures state on `main` for the
# launch scorecard; it needs a live cluster, so it cannot gate a PR. The merge
# gate is the ten-minute set in go-ci.yml.
# ----------------------------------------------------------------------------
name: exit-test-tool-dispatch

on:
  push:
    branches: [main]
    paths:
      - 'internal/engine/harness/**'
      - 'internal/platform/componentcatalog/**'
      - 'internal/server/daemon/**'
      # The daemon's schema and the entitlements reader: a migration that
      # lags a reader failed every ceiling check on main and no run
      # measured it until the next schedule (gibson#13, #174).
      - 'pkg/platform/migrations/**'
      - 'pkg/billing/entitlements/**'
      - 'tests/e2e/tool_dispatch_test.go'
      - 'tests/e2e/helpers/**'
      # The plugin secret revocation half (gibson#154): the event stream,
      # the admin RPC that revokes, and the suite.
      - 'internal/platform/componentevents/**'
      - 'internal/server/admin/**'
      - 'tests/e2e/plugin_secret_revocation_test.go'
      - '.github/scripts/run-e2e-job.sh'
      - '.github/workflows/exit-test-tool-dispatch.yml'
  schedule:
    # Daily. A tool path that is gated today and not tomorrow is the failure
    # this catches; nothing else exercises it on a real cluster.
    - cron: '30 5 * * *'
  workflow_dispatch: {}

# One run at a time, and a run that started finishes. With cancel-in-progress
# the merge queue cancelled every run before its cluster stood up (three in a
# row on 2026-09-18: 35380002787, 35383082878, 35384991958 started and each
# merge to main killed the one before it), so the scorecard row never moved
# and the diagnostics from gibson#143 never printed. GitHub queues at most one
# pending run per group, so the newest push still gets measured, after the
# run in flight completes.
concurrency:
  group: exit-test-tool-dispatch-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # hosted's recreate renders the chart from a checkout of zeroroot-ai/charts.
  CHARTS_ROOT: ${{ github.workspace }}/charts
  NS: gibson
  RELEASE: gibson
  CLUSTER: gibson
  # The kind node the hosted bring-up creates (baseline-up.sh: <cluster>-control-plane).
  NODE: gibson-control-plane

jobs:
  tool-dispatch:
    name: manifest-seeded tools dispatch only for the tenants that enabled them
    runs-on: ubuntu-latest
    # 120, not 45: the kind bringup alone took 45 minutes on 2026-09-18
    # (run 35399104370 hit the limit inside "Stand up the cluster" with
    # progress still flowing), the build and the tool suite need 30 more,
    # and the plugin revocation suite up to 20 (gibson#154).
    timeout-minutes: 120
    steps:
      - name: Checkout gibson
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gibson

      # The kind bring-up (make substrate / make recreate ENV=kind), the
      # sanctioned setec+gvisor profile and the gvisor node-prep live in the
      # hosted repo since the 2026-09-04 split (ADR-0086; deploy and gitops
      # were deleted). Reuse them rather than re-implementing the cluster in
      # this file (ONE bring-up path). hosted is private, so the checkout
      # needs the org read PAT; the default GITHUB_TOKEN cannot read it.
      - name: Checkout hosted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zeroroot-ai/hosted
          path: hosted
          token: ${{ secrets.GH_PAT_PLATFORM_RO }}

      # The chart source lives in zeroroot-ai/charts (ADR-0086); hosted holds
      # none and its recreate reads CHARTS_ROOT. charts is public.
      - name: Checkout charts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zeroroot-ai/charts
          path: charts

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: gibson/go.mod
          cache-dependency-path: gibson/go.sum

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.2

      - name: Install kind + kubectl
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true

      # `make recreate ENV=kind` runs stage 1 through terraform (deploy#1776,
      # scripts/recreate-kind.sh:203). The deleted `vanilla-fresh` did not, so
      # nothing here installed it and every exit test died with
      # "terraform is not on PATH" (run 33675016607). Pinned to hosted's own CI
      # version; kind/gibson requires >= 1.9.
      - name: Install terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      # Stage 0 writes the bringup keyring the install reads (ADR-0015,
      # deploy#1730, deploy#1732). The registry pull token is the keyring
      # member GHCR_PULL_TOKEN now; baseline-up.sh refuses the environment
      # variable it used to take, so there is one path and no second one. The
      # state dir is the runner's temp, because nothing here owns /bulk.
      - name: Stage 0, the substrate and the bringup keyring
        working-directory: hosted
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_RO_PAT }}
        run: |
          if [ -z "${GHCR_PULL_TOKEN}" ]; then
            echo "::error::GHCR_RO_PAT is required to pull first-party images (daemon, setec)."
            exit 1
          fi
          SUBSTRATE_DIR="$RUNNER_TEMP/substrate" make substrate ENV=kind

      # Stand up kind with the sanctioned setec+gvisor profile. baseline-up.sh
      # --fresh-kind does the gvisor node-prep (runsc install + the containerd
      # runsc handler) and installs the umbrella with values-baseline.yaml. The
      # 2-core overlay shrinks REQUESTS so the whole platform packs onto the runner.
      - name: Stand up the setec+gvisor cluster
        working-directory: hosted
        run: |
          SUBSTRATE_DIR="$RUNNER_TEMP/substrate" \
            RUNG=ci make recreate ENV=kind

      # The node must actually advertise gvisor, or every sandbox stays Pending.
      # Kept explicit so a node-prep regression fails HERE with a clear message,
      # not as a mystery timeout later.
      - name: Node advertises gvisor
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            v=$(kubectl get node "$NODE" -o jsonpath='{.metadata.labels.setec\.zeroroot\.ai/runtime\.gvisor}' 2>/dev/null || true)
            [ "$v" = "true" ] && { echo "node advertises runtime.gvisor=true"; break; }
            sleep 5
          done
          v=$(kubectl get node "$NODE" -o jsonpath='{.metadata.labels.setec\.zeroroot\.ai/runtime\.gvisor}' 2>/dev/null || true)
          if [ "$v" != "true" ]; then
            echo "::error::node does not advertise runtime.gvisor=true — gvisor node-prep failed (runsc binary or the containerd io.containerd.cri.v1.runtime handler is missing)"
            kubectl -n setec-system logs -l app.kubernetes.io/component=runtime-agent --tail=40 || true
            exit 1
          fi

      # Swap in a TEST-MODE daemon so the e2e suite can dial gRPC directly:
      # authz disabled (no Envoy/ext-authz in the test), test fixtures on, and
      # built with setec_integration so tool dispatch reaches the real setec
      # executor. This changes ONLY how the client authenticates, never the
      # setec+gvisor runtime under test.
      # The overlay below builds FROM the private daemon image on ghcr.io.
      # The cluster pulls it with the keyring's pull token, but the runner's
      # own docker has no credential and gets 401 (run 33643826807). Log it in
      # with the same read-only token, so one token serves both.
      - name: Log the runner's docker in to ghcr.io
        env:
          GHCR_RO_PAT: ${{ secrets.GHCR_RO_PAT }}
        run: echo "$GHCR_RO_PAT" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build + load the test-mode daemon
        working-directory: gibson
        run: |
          set -euo pipefail
          # Overlay the test-tagged binary onto the daemon image the sanctioned
          # install already pulled, so the daemon's baked-in assets stay in
          # place. Discover that reference from the running StatefulSet rather
          # than hardcoding a tag.
          BASE=$(kubectl -n "$NS" get statefulset -l app.kubernetes.io/component=daemon \
            -o jsonpath='{.items[0].spec.template.spec.containers[?(@.name=="gibson")].image}')
          echo "overlaying onto base daemon image: ${BASE}"
          mkdir -p /tmp/dctx
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -tags="setec_integration test_fixtures" \
            -ldflags="-s -w -X github.com/zeroroot-ai/gibson/pkg/version.GitCommit=$(git rev-parse --short HEAD)" \
            -o /tmp/dctx/gibson ./cmd/gibson
          cat > /tmp/dctx/Dockerfile <<EOF
          FROM ${BASE}
          COPY gibson /usr/local/bin/gibson
          EOF
          docker build -t ghcr.io/zeroroot-ai/gibson:e2e-tool /tmp/dctx
          kind load docker-image ghcr.io/zeroroot-ai/gibson:e2e-tool --name "$CLUSTER"

      # The same patch deploys the GitHub plugin, the fixture of the plugin
      # secret revocation exit test (gibson#154): the real image the
      # integrations CI published, pinned by digest, rendered by the chart's
      # plugins template beside Envoy (pod runtime, SVID enrolment,
      # cred:github_token declared as a required startup secret). One patch
      # means one Argo sync and one daemon rollout: a second sync later rolled
      # the daemon again and the revocation suite started against a
      # restarting daemon (run 35626821216). The plugin pod restarts on a
      # back-off until the suite seeds its secret; the suite waits for that.
      #
      # The digest is spliced into the JSON outside the single quotes, on
      # purpose. Argo CD expands `${NAME}` in a Helm parameter value from its
      # own build environment and an unknown name expands to nothing, so a
      # literal `${PLUGIN_IMAGE_DIGEST}` reached the chart as an empty digest
      # and the template fell back to the appVersion tag (run 35626821216).
      # `enabled` is not forceString: the template tests the value's truth,
      # and the string "false" is a non-empty string.
      - name: Point the daemon at the test-mode image with authz off + fixtures on, and deploy the GitHub plugin
        working-directory: hosted
        env:
          # ghcr.io/zeroroot-ai/integrations/github :latest = sha-944b8fe,
          # built on sdk v0.179.0 (integrations#16), the first SDK that
          # subscribes to WatchComponentEvents. Bump it when the integrations
          # CI publishes a new digest.
          PLUGIN_IMAGE_DIGEST: sha256:bfbaa4612be0e66b13742c2eeac9a4a5d9788e3373b517c8b7cdcbccc1da1b0f
        run: |
          set -euo pipefail
          # The e2eRunner values register the runner's ClusterSPIFFEID,
          # allow-list its SVID, and set GIBSON_TEST_FIXTURES_ENABLED on the
          # daemon (charts#142): the chart has no gibson.extraEnv seam, so
          # the parameter that used to be here never reached the daemon.
          # The e2eRunner values register the runner's ClusterSPIFFEID and
          # allow-list its SVID on the daemon's gRPC listener. Without them the
          # runner has no identity and the daemon closes its connection: the
          # listener speaks SPIFFE mTLS and refuses plaintext outright
          # (zero-trust-hardening Req 1.2).
          kubectl -n argocd patch application gibson --type json -p '[
              {"op":"add","path":"/spec/source/helm/values","value":"gibson-workloads:\n  gibson:\n    e2eRunner:\n      enabled: true\n  spiffe:\n    allowedPeerIDs:\n      - spiffe://zeroroot.ai/platform/tenant-operator\n      - spiffe://zeroroot.ai/platform/connector-operator\n      - spiffe://zeroroot.ai/platform/e2e-runner\n"},
              {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.gibson.image.repository","value":"ghcr.io/zeroroot-ai/gibson","forceString":true}},
              {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.gibson.image.tag","value":"e2e-tool","forceString":true}},
              {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.gibson.image.pullPolicy","value":"IfNotPresent","forceString":true}},
              {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.gibson.authz.enabled","value":"false"}},
              {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.plugins.github.enabled","value":"true"}},
              {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.plugins.github.runtime","value":"pod","forceString":true}},
              {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.plugins.github.image.repository","value":"ghcr.io/zeroroot-ai/integrations/github","forceString":true}},
              {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.plugins.github.image.digest","value":"'"${PLUGIN_IMAGE_DIGEST}"'","forceString":true}},
              {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.plugins.github.image.pullPolicy","value":"IfNotPresent","forceString":true}}
            ]'

          for i in $(seq 1 60); do
            img=$(kubectl -n "$NS" get statefulset -l app.kubernetes.io/component=daemon \
                    -o jsonpath='{.items[0].spec.template.spec.containers[?(@.name=="gibson")].image}' 2>/dev/null || true)
            case "$img" in *:e2e-tool) echo "daemon image is $img"; break;; esac
            [ "$i" = 60 ] && { echo "::error::the daemon StatefulSet never took the e2e-tool image (Argo app: $(kubectl -n argocd get app gibson -o jsonpath='{.status.sync.status}/{.status.health.status}'))"; exit 1; }
            sleep 20
          done
          kubectl -n "$NS" rollout status statefulset -l app.kubernetes.io/component=daemon --timeout=20m
          # Confirm the daemon wired the sandboxed TOOL executor — the linchpin
          # for this test, the way the agent launcher is for the agent one.
          #
          # NEVER `kubectl ... | grep -q` under `set -o pipefail`: grep -q exits
          # on the first match, kubectl then dies of SIGPIPE, and pipefail
          # reports the PIPELINE as failed even though the match succeeded, so
          # the check can never pass. Read into a variable and match the string.
          # Poll too: the line lands a few seconds after the Pod is Ready.
          for i in $(seq 1 30); do
            logs=$(kubectl -n "$NS" logs -l app.kubernetes.io/component=daemon -c gibson --tail=400 2>/dev/null || true)
            case "$logs" in
              *"sandboxed tool executor wired"*) echo "daemon wired the sandboxed tool executor"; break ;;
            esac
            if [ "$i" -eq 30 ]; then
              echo "::error::daemon did not wire the sandboxed tool executor within 5m (check sandbox.enabled + sandbox_class)"
              printf '%s\n' "$logs"
              exit 1
            fi
            sleep 10
          done
          # The plugin Deployment carrying the digest is the proof the plugin
          # values reached the chart. Readiness is not awaited: the pod cannot
          # pass its startup probe before the suite seeds the secret it declares.
          img=$(kubectl -n "$NS" get deployment "${RELEASE}-plugin-github" \
                  -o jsonpath='{.spec.template.spec.containers[?(@.name=="plugin")].image}' 2>/dev/null || true)
          case "$img" in
            *"@${PLUGIN_IMAGE_DIGEST}") echo "plugin Deployment rendered: $img" ;;
            *) echo "::error::the GitHub plugin Deployment did not render with the pinned digest (got '${img}'; Argo app: $(kubectl -n argocd get app gibson -o jsonpath='{.status.sync.status}/{.status.health.status}'))"; exit 1 ;;
          esac

      # The suite runs INSIDE the cluster, not over a port-forward.
      #
      # The daemon's gRPC listener speaks SPIFFE mTLS and refuses to bind a
      # non-loopback plaintext listener at all (zero-trust-hardening Req 1.2),
      # so a port-forward from this runner is closed before the gRPC preface —
      # verified live, and authz.enabled=false does not change it because that
      # disables authorization, not transport. The suite therefore needs an
      # attested SVID, which means being a pod in the mesh.
      - name: Build the e2e suite into an image
        id: suite-image
        working-directory: gibson
        run: |
          set -euo pipefail
          mkdir -p /tmp/ectx
          # Compile the suite to a static binary. `go test -c` keeps it a test
          # binary, so -test.run / -test.v still select and report normally.
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test -tags=e2e -c \
            -o /tmp/ectx/e2e.test ./tests/e2e/
          cat > /tmp/ectx/Dockerfile <<'EOF'
          FROM gcr.io/distroless/static-debian12:nonroot
          COPY e2e.test /usr/local/bin/e2e.test
          ENTRYPOINT ["/usr/local/bin/e2e.test"]
          EOF
          docker build -t ghcr.io/zeroroot-ai/gibson-e2e-runner:local /tmp/ectx
          kind load docker-image ghcr.io/zeroroot-ai/gibson-e2e-runner:local --name "$CLUSTER"

      - name: Run the tool-dispatch exit test in-cluster
        run: gibson/.github/scripts/run-e2e-job.sh gibson-e2e-tool-dispatch TestToolDispatch 20m

      # Plugin secret revocation (gibson#154), on the plugin the daemon patch
      # deployed. Runs whenever the suite image built, so a tool-dispatch
      # failure does not hide this verdict and a bring-up failure does not
      # fake one.
      - name: Run the plugin secret revocation exit test in-cluster
        if: ${{ !cancelled() && steps.suite-image.outcome == 'success' }}
        run: gibson/.github/scripts/run-e2e-job.sh gibson-e2e-plugin-revocation TestPluginSecretRevocation 20m

      # always(), not failure(): a job that hits timeout-minutes is
      # cancelled, and a cancelled job skips failure() steps, so the
      # 2026-09-18 timeout (run 35399104370) left nothing to read.
      - name: Diagnostics on failure
        if: always()
        run: |
          kubectl -n "$NS" get pods || true
          # A pod stuck in Init:Error is invisible in the pod list and in the
          # daemon log: print every not-ready pod's events and the last log of
          # each container that is not ready, init containers included. The
          # 2026-09-18 runs failed here twice with nothing to read (gibson#14).
          echo "=== pods with a container not ready ==="
          for p in $(kubectl -n "$NS" get pods -o json | jq -r '.items[] | select(.status.phase != "Succeeded") | select([.status.containerStatuses[]?, .status.initContainerStatuses[]?] | any(.ready == false)) | .metadata.name'); do
            echo "--- $p"; kubectl -n "$NS" describe pod "$p" | grep -A15 '^Events' || true
            for c in $(kubectl -n "$NS" get pod "$p" -o json | jq -r '[.status.containerStatuses[]?, .status.initContainerStatuses[]?] | .[] | select(.ready == false) | .name'); do
              echo "..... last log of $p/$c (previous instance if it restarted)"
              kubectl -n "$NS" logs "$p" -c "$c" --previous --tail=40 2>/dev/null || kubectl -n "$NS" logs "$p" -c "$c" --tail=40 || true
            done
          done
          echo "=== Argo application conditions ==="
          kubectl -n argocd get app gibson -o jsonpath='{range .status.conditions[*]}{.type}: {.message}{"\n"}{end}' 2>/dev/null || true
          kubectl -n argocd get app gibson -o jsonpath='{range .status.operationState.syncResult.resources[?(@.status=="SyncFailed")]}{.kind}/{.name}: {.message}{"\n"}{end}' 2>/dev/null || true
          kubectl -n setec-system get pods,sandboxes,sandboxclasses || true
          kubectl -n setec-sandboxes get pods || true
          # The plugin's own account of the revocation (gibson#154): its
          # enrolment, "startup secret resolved", "events: secret access
          # revoked" and the Degraded transition are all SDK log lines.
          echo "=== GitHub plugin pod ==="
          kubectl -n "$NS" get pods -l gibson.zeroroot.ai/plugin=github -o wide || true
          for p in $(kubectl -n "$NS" get pods -l gibson.zeroroot.ai/plugin=github -o name 2>/dev/null); do
            kubectl -n "$NS" describe "$p" | grep -A15 '^Events' || true
            kubectl -n "$NS" logs "$p" -c plugin --tail=200 || true
            kubectl -n "$NS" logs "$p" -c plugin --previous --tail=60 2>/dev/null || true
          done
          # ext-authz decides every edge call a plugin makes; a deny at the
          # edge never reaches the daemon log (run 35630951761: the plugin's
          # RegisterComponent was PermissionDenied and the daemon log had
          # nothing to say about it).
          echo "=== ext-authz ==="
          kubectl -n "$NS" logs -l app.kubernetes.io/component=ext-authz --tail=300 || true
          kubectl -n "$NS" logs -l app.kubernetes.io/component=daemon -c gibson --tail=1500 || true
