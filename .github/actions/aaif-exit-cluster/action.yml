name: Stand up the kind cluster of the AAIF exit tests
description: >
  The exit tests of the Agent Skills, the finding evidence and the AAIF alignment
  epics run on one kind cluster. This action brings it up in the way of
  exit-test-model-gate.yml. It starts the substrate and the cluster, builds the
  test-mode daemon, ext-authz and the tenant-operator of the checkout, loads them
  into kind, points the Argo application at them, and waits for each rollout. It
  then builds the e2e suite into an image and loads it.
  The calling workflow checks out gibson, hosted and charts first. It also sets up
  Go, Helm, kind, terraform and the inotify limits.
inputs:
  ghcr-ro-pat:
    description: The read-only token for ghcr.io. The substrate and the first-party images need it.
    required: true
  with-kvm:
    description: "Set to true when the test runs a sandbox. The action then opens /dev/kvm and builds the daemon with setec_integration."
    required: false
    default: "false"
  image-tag:
    description: The tag of the images that this action builds.
    required: false
    default: aaif-exit
  node:
    description: The kind node.
    required: false
    default: gibson-control-plane
  shared-skill-name:
    description: >
      The name of one Shared Agent Skill that the operator offers. Set it with
      shared-skill-reference. The action writes both into the daemon config.
    required: false
    default: ""
  shared-skill-reference:
    description: The digest reference of the Shared Agent Skill, <registry>/<repository>@sha256:<hex>.
    required: false
    default: ""
  namespace:
    description: The release namespace.
    required: false
    default: gibson
  cluster:
    description: The kind cluster name.
    required: false
    default: gibson
  connector-install-patterns:
    description: >
      The host patterns of the connectors of a server that the customer hosts, as
      JSON: {"<connector>/<variable>": ["https://host:port"]}. The action sets it
      as gibson-workloads.gibson.connectorInstallPatterns, so the daemon accepts
      a connector URL that matches. Empty means no pattern, and the cluster is
      the same as before.
    required: false
    default: ""
  build-connector-operator:
    description: >
      Set to true when the test needs the connector-operator of the checkout, not
      the one that charts pins. The action builds it, loads it and points the
      chart at it.
    required: false
    default: "false"
  mock-forge-image:
    description: >
      The digest reference of the mock-forge test image of zeroroot-ai/connectors,
      ghcr.io/zeroroot-ai/connectors-mock-forge@sha256:<hex>. Set it to start the
      mock as a container next to the kind nodes. Empty means no mock.
    required: false
    default: ""
  mock-forge-host:
    description: The DNS name that the mock answers to, from the pods of the cluster.
    required: false
    default: forge.mock.example.com
  mock-forge-port:
    description: The port of the mock.
    required: false
    default: "8443"
outputs:
  mock-forge-url:
    description: The https URL of the mock as a pod sees it. Empty when the mock does not run.
    value: ${{ steps.mock-forge.outputs.url }}
  mock-forge-address:
    description: The address host:port of the mock as the runner sees it. Empty when the mock does not run.
    value: ${{ steps.mock-forge.outputs.address }}
  mock-forge-ca-file:
    description: The path on the runner of the PEM of the authority of the mock. Empty when the mock does not run.
    value: ${{ steps.mock-forge.outputs.ca-file }}
runs:
  using: composite
  steps:
    # Stage 0 writes the bringup keyring that the install reads (ADR-0083).
    - name: Stage 0, the substrate and the bringup keyring
      shell: bash
      working-directory: hosted
      env:
        GHCR_PULL_TOKEN: ${{ inputs.ghcr-ro-pat }}
      run: |
        if [ -z "${GHCR_PULL_TOKEN}" ]; then
          echo "::error::GHCR_RO_PAT is required to pull first-party images."
          exit 1
        fi
        SUBSTRATE_DIR="$RUNNER_TEMP/substrate" make substrate ENV=kind

    - name: Open /dev/kvm for the launcher
      if: ${{ inputs.with-kvm == 'true' }}
      uses: ./gibson/.github/actions/open-kvm

    - name: Stand up the cluster
      shell: bash
      working-directory: hosted
      env:
        CHARTS_ROOT: ${{ github.workspace }}/charts
      run: |
        SUBSTRATE_DIR="$RUNNER_TEMP/substrate" \
          RUNG=ci make recreate ENV=kind

    - name: Node offers KVM to the launcher
      if: ${{ inputs.with-kvm == 'true' }}
      uses: ./gibson/.github/actions/node-offers-kvm
      with:
        node: ${{ inputs.node }}

    # The images below build FROM the private daemon image on ghcr.io. The
    # runner docker needs the token that the cluster pulls with.
    - name: Log the docker of the runner in to ghcr.io
      shell: bash
      env:
        GHCR_RO_PAT: ${{ inputs.ghcr-ro-pat }}
      run: echo "$GHCR_RO_PAT" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    # A test-mode daemon: test fixtures on, so the suite can dial it. This
    # changes how the client authenticates, never the runtime.
    - name: Build and load the test-mode daemon
      shell: bash
      working-directory: gibson
      env:
        NS: ${{ inputs.namespace }}
        CLUSTER: ${{ inputs.cluster }}
        TAG: ${{ inputs.image-tag }}
        TAGS: ${{ inputs.with-kvm == 'true' && 'setec_integration test_fixtures' || 'test_fixtures' }}
      run: |
        set -euo pipefail
        BASE=$(kubectl -n "$NS" get statefulset -l app.kubernetes.io/component=daemon \
          -o jsonpath='{.items[0].spec.template.spec.containers[?(@.name=="gibson")].image}')
        echo "overlaying onto base daemon image: ${BASE}"
        mkdir -p /tmp/dctx
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
          -tags="${TAGS}" \
          -ldflags="-s -w -X github.com/zeroroot-ai/gibson/pkg/version.GitCommit=$(git rev-parse --short HEAD)" \
          -o /tmp/dctx/gibson ./cmd/gibson
        cat > /tmp/dctx/Dockerfile <<EOF
        FROM ${BASE}
        COPY gibson /usr/local/bin/gibson
        EOF
        docker build -t "ghcr.io/zeroroot-ai/gibson:${TAG}" /tmp/dctx
        kind load docker-image "ghcr.io/zeroroot-ai/gibson:${TAG}" --name "$CLUSTER"

    # The pinned ext-authz and tenant-operator do not hold the AAIF code. The
    # gateway calls ext-authz for each model call, and the tenant-operator renders
    # the route of each provider.
    - name: Build and load ext-authz and the tenant-operator of the checkout
      shell: bash
      working-directory: gibson
      env:
        CLUSTER: ${{ inputs.cluster }}
        TAG: ${{ inputs.image-tag }}
      run: |
        set -euo pipefail
        docker buildx build --progress=plain --load \
          -f build/ext-authz.Dockerfile -t "ghcr.io/zeroroot-ai/ext-authz:${TAG}" .
        kind load docker-image "ghcr.io/zeroroot-ai/ext-authz:${TAG}" --name "$CLUSTER"
        docker buildx build --progress=plain --load \
          -f build/tenant-operator.Dockerfile -t "ghcr.io/zeroroot-ai/tenant-operator:${TAG}" .
        kind load docker-image "ghcr.io/zeroroot-ai/tenant-operator:${TAG}" --name "$CLUSTER"

    # The connector-operator of the checkout, for a test of the code of this
    # operator. The pinned one does not hold it (gibson#1517).
    - name: Build and load the connector-operator of the checkout
      if: ${{ inputs.build-connector-operator == 'true' }}
      shell: bash
      working-directory: gibson
      env:
        CLUSTER: ${{ inputs.cluster }}
        TAG: ${{ inputs.image-tag }}
      run: |
        set -euo pipefail
        docker buildx build --progress=plain --load \
          -f build/connector-operator.Dockerfile -t "ghcr.io/zeroroot-ai/connector-operator:${TAG}" .
        kind load docker-image "ghcr.io/zeroroot-ai/connector-operator:${TAG}" --name "$CLUSTER"

    # The e2eRunner values register the ClusterSPIFFEID of the runner, allow-list
    # its SVID on the daemon, and set GIBSON_TEST_FIXTURES_ENABLED. One patch means
    # one Argo sync and one rollout of each component.
    #
    # gateway.inClusterProviders opens the network policy of the proxy to the mock
    # provider and to no other pod. The entry matches tests/fixtures/mockprovider/
    # mockprovider.yaml: the namespace gibson-e2e-mock, the pod label
    # app=mock-provider, and the container port 8443 of the TLS front (not the
    # Service port 443, and not the record port 18080). The chart owns the policy
    # of the proxy, so the fixture has none.
    # allow_private_llm_endpoints: the tests save a provider at the mock
    # address in the cluster, which the base_url check refuses by default.
    - name: Point the Argo application at the images of the checkout
      shell: bash
      working-directory: hosted
      env:
        NS: ${{ inputs.namespace }}
        TAG: ${{ inputs.image-tag }}
        SHARED_SKILL_NAME: ${{ inputs.shared-skill-name }}
        SHARED_SKILL_REF: ${{ inputs.shared-skill-reference }}
        INSTALL_PATTERNS: ${{ inputs.connector-install-patterns }}
        BUILD_CONNECTOR_OPERATOR: ${{ inputs.build-connector-operator }}
        WITH_KVM: ${{ inputs.with-kvm }}
      run: |
        set -euo pipefail
        # The operator source of Agent Skills: one entry in the daemon config.
        # The daemon pulls it at start, so it has to be in the first rollout.
        if [ -n "${SHARED_SKILL_NAME}" ] || [ -n "${SHARED_SKILL_REF}" ]; then
          if [ -z "${SHARED_SKILL_NAME}" ] || [ -z "${SHARED_SKILL_REF}" ]; then
            echo "::error::shared-skill-name and shared-skill-reference go together"
            exit 1
          fi
          shared_params=',{"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.gibson.config.sharedAgentSkills[0].name","value":"'"${SHARED_SKILL_NAME}"'","forceString":true}},{"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.gibson.config.sharedAgentSkills[0].reference","value":"'"${SHARED_SKILL_REF}"'","forceString":true}}'
        else
          shared_params=""
        fi
        # The host patterns of the connectors of a server that the customer
        # hosts. The value is JSON, which is a YAML flow mapping. With no
        # input the values are the same as before.
        patterns_values=""
        if [ -n "${INSTALL_PATTERNS}" ]; then
          printf '%s' "${INSTALL_PATTERNS}" | jq -e 'type == "object" and (to_entries | all(.value | type == "array"))' >/dev/null \
            || { echo "::error::connector-install-patterns must be a JSON object of lists"; exit 1; }
          patterns_values="    connectorInstallPatterns: $(printf '%s' "${INSTALL_PATTERNS}" | jq -c .)"$'\n'
        fi
        # On kind the API host sits behind Envoy, so the agent sandbox class needs
        # the kube-dns resolver and egress to kube-dns and Envoy. The script holds
        # the reason and the ops. This is the test profile only.
        sandbox_params=""
        if [ "${WITH_KVM}" = "true" ]; then
          sandbox_params=$("${GITHUB_ACTION_PATH}/../../scripts/agent-class-reaches-api.sh")
        fi
        connector_params=""
        if [ "${BUILD_CONNECTOR_OPERATOR}" = "true" ]; then
          connector_params=',{"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-operators.connectorOperator.image.repository","value":"ghcr.io/zeroroot-ai/connector-operator","forceString":true}},{"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-operators.connectorOperator.image.tag","value":"'"${TAG}"'","forceString":true}},{"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-operators.connectorOperator.image.digest","value":"","forceString":true}},{"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-operators.connectorOperator.image.pullPolicy","value":"IfNotPresent","forceString":true}}'
        fi
        values=$'gateway:\n  inClusterProviders:\n    - namespace: gibson-e2e-mock\n      podLabels:\n        app: mock-provider\n      ports:\n        - 8443\ngibson-workloads:\n  gibson:\n    e2eRunner:\n      enabled: true\n'"${patterns_values}"$'  spiffe:\n    allowedPeers:\n      - platform/tenant-operator\n      - platform/connector-operator\n      - platform/e2e-runner\n      - platform/e2e-member\n'
        values_json=$(printf '%s' "${values}" | jq -Rs .)
        kubectl -n argocd patch application gibson --type json -p '[
            {"op":"add","path":"/spec/source/helm/values","value":'"${values_json}"'},
            {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.gibson.image.repository","value":"ghcr.io/zeroroot-ai/gibson","forceString":true}},
            {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.gibson.image.tag","value":"'"${TAG}"'","forceString":true}},
            {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.gibson.image.digest","value":"","forceString":true}},
            {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.gibson.image.pullPolicy","value":"IfNotPresent","forceString":true}},
            {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.gibson.authz.enabled","value":"false"}},
            {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.gibson.config.security.allow_private_llm_endpoints","value":"true"}},
            {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.extAuthz.image.repository","value":"ghcr.io/zeroroot-ai/ext-authz","forceString":true}},
            {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.extAuthz.image.tag","value":"'"${TAG}"'","forceString":true}},
            {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.extAuthz.image.digest","value":"","forceString":true}},
            {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-workloads.extAuthz.image.pullPolicy","value":"IfNotPresent","forceString":true}},
            {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-operators.tenantOperator.image.repository","value":"ghcr.io/zeroroot-ai/tenant-operator","forceString":true}},
            {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-operators.tenantOperator.image.tag","value":"'"${TAG}"'","forceString":true}},
            {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-operators.tenantOperator.image.digest","value":"","forceString":true}},
            {"op":"add","path":"/spec/source/helm/parameters/-","value":{"name":"gibson-operators.tenantOperator.image.pullPolicy","value":"IfNotPresent","forceString":true}}'"${shared_params}${connector_params}${sandbox_params}"'
          ]'

        wait_image() { # kind name jsonpath suffix
          local get=$1 path=$2 suffix=$3 img=""
          for i in $(seq 1 60); do
            img=$(kubectl -n "$NS" get $get -o jsonpath="$path" 2>/dev/null || true)
            case "$img" in *"$suffix") echo "$get runs $img"; return 0;; esac
            sleep 20
          done
          echo "::error::$get never took the image ${suffix} (got '${img}'; Argo app: $(kubectl -n argocd get app gibson -o jsonpath='{.status.sync.status}/{.status.health.status}'))"
          return 1
        }
        wait_image "statefulset -l app.kubernetes.io/component=daemon" \
          '{.items[0].spec.template.spec.containers[?(@.name=="gibson")].image}' ":${TAG}"
        kubectl -n "$NS" rollout status statefulset -l app.kubernetes.io/component=daemon --timeout=20m
        wait_image "deployment gibson-ext-authz" '{.spec.template.spec.containers[0].image}' "ext-authz:${TAG}"
        kubectl -n "$NS" rollout status deployment/gibson-ext-authz --timeout=15m
        wait_image "deployment gibson-tenant-operator" \
          '{.spec.template.spec.containers[?(@.name=="manager")].image}' "tenant-operator:${TAG}"
        kubectl -n "$NS" rollout status deployment/gibson-tenant-operator --timeout=15m
        if [ "${BUILD_CONNECTOR_OPERATOR}" = "true" ]; then
          wait_image "deployment gibson-connector-operator" \
            '{.spec.template.spec.containers[?(@.name=="manager")].image}' "connector-operator:${TAG}"
          kubectl -n "$NS" rollout status deployment/gibson-connector-operator --timeout=15m
        fi

    # agentgateway sends an unattached policy to no proxy. A route whose ext-authz
    # policy is not attached has no ext-authz check, so a call on it would pass
    # with no authorization. Before the first test call, each AgentgatewayPolicy
    # must be Accepted and Attached on at least one ancestor. The step fails
    # otherwise and names the policies that are not.
    - name: Each AgentgatewayPolicy is Accepted and Attached
      shell: bash
      run: |
        set -euo pipefail
        bad_policies() {
          kubectl get agentgatewaypolicies.agentgateway.dev -A -o json | jq -r '
            .items[]
            | . as $p
            | ($p.status.ancestors // []) as $a
            | def ok($t): any($a[]?.conditions[]?; .type == $t and .status == "True");
              select((($a | length) == 0) or (ok("Accepted") | not) or (ok("Attached") | not))
            | "\($p.metadata.namespace)/\($p.metadata.name) accepted=\(ok("Accepted")) attached=\(ok("Attached")) ancestors=\($a | length)"'
        }
        count=$(kubectl get agentgatewaypolicies.agentgateway.dev -A -o json | jq '.items | length')
        if [ "$count" -eq 0 ]; then
          echo "::error::the cluster has no AgentgatewayPolicy, so no route has an ext-authz check"
          exit 1
        fi
        bad=""
        for _ in $(seq 1 30); do
          bad=$(bad_policies)
          [ -z "$bad" ] && break
          sleep 10
        done
        if [ -n "$bad" ]; then
          echo "::error::an AgentgatewayPolicy is not both Accepted and Attached, so its route has no policy at the proxy:"
          echo "$bad"
          kubectl get agentgatewaypolicies.agentgateway.dev -A -o yaml | tail -n 200
          exit 1
        fi
        echo "all ${count} AgentgatewayPolicy objects are Accepted and Attached"

    # The suite runs inside the cluster. The daemon listener speaks SPIFFE mTLS
    # and refuses plaintext, so the suite needs an attested SVID, which means it
    # must be a pod in the mesh (run-e2e-job.sh).
    - name: Build the e2e suite into an image
      id: suite-image
      shell: bash
      working-directory: gibson
      env:
        CLUSTER: ${{ inputs.cluster }}
      run: |
        set -euo pipefail
        mkdir -p /tmp/ectx
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test -tags=e2e -c \
          -o /tmp/ectx/e2e.test ./tests/e2e/
        cat > /tmp/ectx/Dockerfile <<'EOF'
        FROM gcr.io/distroless/static-debian12:nonroot
        COPY e2e.test /usr/local/bin/e2e.test
        ENTRYPOINT ["/usr/local/bin/e2e.test"]
        EOF
        docker build -t ghcr.io/zeroroot-ai/gibson-e2e-runner:local /tmp/ectx
        kind load docker-image ghcr.io/zeroroot-ai/gibson-e2e-runner:local --name "$CLUSTER"

    # The mock-forge test image of zeroroot-ai/connectors stands in for the forge
    # and the metrics of a buyer. It runs as a container outside the cluster,
    # because the egress policy of each connector denies the private ranges
    # (RFC 1918, so also the 172.18.0.0/16 of the default kind network) and the
    # ranges of the pods and the services, and that rule stays. The container
    # therefore gets its own docker network with a public address range, the
    # documentation range 198.51.100.0/24. Each kind node joins that network. The
    # docker DNS of the network answers the name of the mock, and CoreDNS of the
    # cluster forwards the name to it. The mock refuses plain HTTP on an address
    # that is not loopback, so it runs with TLS and a certificate for its name.
    - name: Start the mock forge next to the kind nodes
      id: mock-forge
      if: ${{ inputs.mock-forge-image != '' }}
      shell: bash
      env:
        IMAGE: ${{ inputs.mock-forge-image }}
        HOST: ${{ inputs.mock-forge-host }}
        PORT: ${{ inputs.mock-forge-port }}
        CLUSTER: ${{ inputs.cluster }}
      run: |
        set -euo pipefail
        NET=mock-forge-net
        SUBNET=198.51.100.0/24
        ADDR=198.51.100.10
        DIR="${RUNNER_TEMP}/mock-forge"
        case "${IMAGE}" in
          *@sha256:*) ;;
          *) echo "::error::mock-forge-image must be a digest reference (<repository>@sha256:<hex>)"; exit 1;;
        esac
        mkdir -p "${DIR}"
        chmod 0777 "${DIR}"
        docker network create --subnet "${SUBNET}" "${NET}"
        docker run -d --name mock-forge --network "${NET}" --ip "${ADDR}" --network-alias "${HOST}" \
          -e "LISTEN_ADDR=:${PORT}" \
          -e "MOCK_TLS_SELF_SIGNED_HOSTS=${HOST},${ADDR}" \
          -e "MOCK_TLS_CA_FILE=/ca/ca.pem" \
          -v "${DIR}:/ca" \
          "${IMAGE}"
        nodes=$(kind get nodes --name "${CLUSTER}")
        [ -n "${nodes}" ] || { echo "::error::kind cluster ${CLUSTER} has no node"; exit 1; }
        for n in ${nodes}; do
          docker network connect "${NET}" "$n"
        done
        # The runner reaches the mock by its address. A node reaches it by the
        # name and by the address.
        ok=""
        for _ in $(seq 1 30); do
          if [ -s "${DIR}/ca.pem" ] && curl -fsS --cacert "${DIR}/ca.pem" \
               --resolve "${HOST}:${PORT}:${ADDR}" "https://${HOST}:${PORT}/_mock/state" >/dev/null; then
            ok=1; break
          fi
          sleep 2
        done
        if [ -z "${ok}" ]; then
          echo "::error::the mock forge did not answer over TLS"
          docker logs mock-forge || true
          exit 1
        fi
        for n in ${nodes}; do
          if ! docker exec "$n" getent hosts "${HOST}" | grep -q "${ADDR}"; then
            echo "::error::node $n does not resolve ${HOST} to ${ADDR}"
            docker exec "$n" cat /etc/resolv.conf || true
            exit 1
          fi
          if ! docker exec "$n" bash -c "exec 3<>/dev/tcp/${ADDR}/${PORT}"; then
            echo "::error::node $n cannot open ${ADDR}:${PORT}"
            exit 1
          fi
        done
        {
          echo "url=https://${HOST}:${PORT}"
          echo "address=${ADDR}:${PORT}"
          echo "ca-file=${DIR}/ca.pem"
        } >> "${GITHUB_OUTPUT}"
