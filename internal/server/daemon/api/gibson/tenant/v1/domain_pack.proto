// DomainPackService is the tenant-facing Domain Pack catalog + per-tenant
// enable/disable lifecycle (ADR-0033). A Domain Pack is curated, versioned
// structure — taxonomy labels, ontology extensions, and technique -> CEL
// predicate bindings — never code (ADR-0033 decision 1), shipped by the
// platform through the standard SDK release/rollout pipeline (ADR-0033
// decision 4).
//
// Enabling a pack for a tenant folds a DomainPackEnabled brain event
// (Timeline-durable, replayable, mission-pinned) that loads its content into
// that tenant's live World ONLY (ADR-0033: "per-tenant, not per-install").
// Disabling folds DomainPackDisabled and removes it. This service is the
// enablement LEVER ONLY — it never hot-reloads pack content; content ships
// once, via a gibson release, and stays fixed until the next one (ADR-0033
// decision 4).
//
// Authorization: every RPC carries a (gibson.auth.v1.authz) annotation.
syntax = "proto3";

package gibson.tenant.v1;

option go_package = "github.com/zeroroot-ai/gibson/internal/server/daemon/api/gibson/tenant/v1;tenantv1";

import "gibson/auth/v1/options.proto";

service DomainPackService {
  // ListDomainPackCatalog returns the curated Domain Packs this tenant may
  // enable. The set is the shipped catalog, filtered by the platform catalog
  // gate (ADR-0033 decisions 1 and 5), mirroring ConnectorService.ListCatalog.
  // Named distinctly from ListCatalog (rather than reusing that RPC/message
  // name) because it lives in the same gibson.tenant.v1 package as
  // ConnectorService.ListCatalog — a second ListCatalogRequest/Response pair
  // in this package would collide in the generated Go bindings.
  rpc ListDomainPackCatalog(ListDomainPackCatalogRequest) returns (ListDomainPackCatalogResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "member"
      object_type: "tenant"
      object_deriver: "tenant_from_identity"
      allowed_identities: 3  // USER | SERVICE
    };
  }

  // ListDomainPacks returns the tenant's currently enabled Domain Packs.
  rpc ListDomainPacks(ListDomainPacksRequest) returns (ListDomainPacksResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "member"
      object_type: "tenant"
      object_deriver: "tenant_from_identity"
      allowed_identities: 3  // USER | SERVICE
    };
  }

  // EnableDomainPack folds a DomainPackEnabled event that loads the named
  // catalog pack's taxonomy/ontology/CEL predicate bindings into the
  // caller's tenant World.
  // Requires tenant admin (ADR-0067, matching EnableConnector): enabling a
  // pack changes what every mission in the tenant can reason about, so no
  // per-pack relation can gate it.
  rpc EnableDomainPack(EnableDomainPackRequest) returns (EnableDomainPackResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "admin"
      object_type: "tenant"
      object_deriver: "tenant_from_identity"
      allowed_identities: 3  // USER | SERVICE
    };
  }

  // DisableDomainPack folds a DomainPackDisabled event that removes the
  // pack's content from the caller's tenant World.
  // Requires tenant admin (ADR-0067), matching EnableDomainPack.
  rpc DisableDomainPack(DisableDomainPackRequest) returns (DisableDomainPackResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "admin"
      object_type: "tenant"
      object_deriver: "tenant_from_identity"
      allowed_identities: 3  // USER | SERVICE
    };
  }
}

// DomainPackCatalogEntry is one curated Domain Pack the tenant may enable.
message DomainPackCatalogEntry {
  string name = 1;
  int32 version = 2;
  // author identifies who curates this pack (ADR-0033 decision 5): the
  // platform owner for a catalog pack.
  string author = 3;
  // visibility is "public" or "private" (ADR-0033 decisions 1 and 5). A
  // catalog entry is always "public" in practice — a "private" pack is a
  // tenant extension, which this service does not list.
  string visibility = 4;
  // entitlement is the optional billing entitlement key gating this pack
  // (ADR-0033 decision 5). Empty means free — no entitlement check applies.
  string entitlement = 5;
  repeated string taxonomy_node_labels = 6;
  repeated string taxonomy_relationship_types = 7;
  // techniques is the sorted set of technique names this pack binds a
  // settlement predicate for (the keys of the pack's Predicates map).
  repeated string techniques = 8;
}

message ListDomainPackCatalogRequest {}

message ListDomainPackCatalogResponse {
  repeated DomainPackCatalogEntry entries = 1;
}

// DomainPackView is one of the tenant's currently enabled Domain Packs.
message DomainPackView {
  string name = 1;
  int32 version = 2;
  repeated string techniques = 3;
}

message ListDomainPacksRequest {}

message ListDomainPacksResponse {
  repeated DomainPackView packs = 1;
}

message EnableDomainPackRequest {
  // name is the catalog entry to enable (e.g. "main").
  string name = 1;
}

message EnableDomainPackResponse {
  string name = 1;
  int32 version = 2;
}

message DisableDomainPackRequest {
  string name = 1;
}

message DisableDomainPackResponse {}
