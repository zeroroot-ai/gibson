// OntologyExtensionService is the tenant-OWNER-facing approval surface for
// agent-proposed Taxonomy extensions (ADR-0124 §2, ADR-0133 decisions 2-3,
// gibson#392).
//
// An agent proposes a new Taxonomy node label or relationship type it
// discovers at runtime via ProposeOntologyExtension (gibson#391, the
// agent-facing HarnessCallbackService RPC in the OSS SDK). That proposal is
// folded into the caller's tenant World as a pending sighting and counted
// for recurrence by taxonomy.PromotionGate — it is NEVER auto-promoted
// (ADR-0133 decision 3).
//
// This service is the other end of that pipeline: the tenant owner reviews
// every pending proposal (ListOntologyExtensionProposals) and explicitly
// approves or rejects one. Approval runs the human-in-the-loop half of
// taxonomy.PromotionGate's settlement rule; once BOTH halves are satisfied
// (the proposal has recurred enough independent times, AND the owner
// approved it), the label is promoted into live, per-tenant, replayable
// Cypher structure immediately — the tenant's own taxonomy extension, visible
// to every mission in that tenant from then on. Rejection is a terminal
// decision recorded for audit; it never mutates the Taxonomy.
//
// Gated strictly to the tenant's OWNER relation (not "admin"): ADR-0133
// decision 3 calls for "explicit tenant-owner approval" specifically — one
// step stronger than the "tenant admin" gate DomainPackService's
// EnableDomainPack uses for already-curated catalog content. A proposal
// reviewed here is NOVEL, agent-discovered structure the platform has never
// seen before; only the tenant's Owner may admit it.
//
// Authorization: every RPC carries a (gibson.auth.v1.authz) annotation.
syntax = "proto3";

package gibson.tenant.v1;

option go_package = "github.com/zeroroot-ai/gibson/internal/server/daemon/api/gibson/tenant/v1;tenantv1";

import "gibson/auth/v1/options.proto";
import "buf/validate/validate.proto";

// OntologyProposalKind distinguishes a proposed Taxonomy node label from a
// proposed relationship type — mirrors internal/engine/taxonomy.ProposalKind.
enum OntologyProposalKind {
  ONTOLOGY_PROPOSAL_KIND_UNSPECIFIED = 0;
  ONTOLOGY_PROPOSAL_KIND_NODE_LABEL = 1;
  ONTOLOGY_PROPOSAL_KIND_RELATIONSHIP_TYPE = 2;
}

// OntologyProposalStatus mirrors brain.OntologyProposalStatus.
enum OntologyProposalStatus {
  ONTOLOGY_PROPOSAL_STATUS_UNSPECIFIED = 0;
  ONTOLOGY_PROPOSAL_STATUS_PENDING = 1;
  ONTOLOGY_PROPOSAL_STATUS_APPROVED = 2;
  ONTOLOGY_PROPOSAL_STATUS_REJECTED = 3;
}

// OntologyExtensionProposal is one taxonomy node label or relationship type
// an agent proposed in the caller's tenant, with its recurrence so far and
// the tenant owner's decision (if any).
message OntologyExtensionProposal {
  // Removed in gibson#502: served and never read by any consumer.
  reserved 3, 4, 5, 8, 9, 10;
  reserved "recurrence", "last_proposer", "last_claim", "reject_reason", "promoted", "promoted_taxonomy_version";
  OntologyProposalKind kind = 1;
  string label = 2;
  OntologyProposalStatus status = 6;
  // reviewer is the tenant owner who approved or rejected this proposal.
  // Empty while status is PENDING.
  string reviewer = 7;
}

message ListOntologyExtensionProposalsRequest {}

message ListOntologyExtensionProposalsResponse {
  // Removed in gibson#502: served and never read by any consumer.
  reserved 1;
  reserved "proposals";
}

message ApproveOntologyExtensionProposalRequest {
  OntologyProposalKind kind = 1 [(buf.validate.field).enum = { defined_only: true }];
  string label = 2 [(buf.validate.field).string = { max_len: 4096 }];
}

// ApproveOntologyExtensionProposalResponse is intentionally empty: whether
// this approval ALSO completed settlement (the proposal had already recurred
// enough times, so it is live now) is decided by the tenant's brain.Engine
// single-writer fold, which runs asynchronously off this RPC (ADR-0101,
// mirroring ProposeOntologyExtension's own documented contract). A caller
// that needs the resulting promoted/live state calls
// ListOntologyExtensionProposals afterward rather than assume it is visible
// the instant this call returns — reporting a synchronous guess here would
// be wrong exactly often enough to matter.
message ApproveOntologyExtensionProposalResponse {}

message RejectOntologyExtensionProposalRequest {
  OntologyProposalKind kind = 1 [(buf.validate.field).enum = { defined_only: true }];
  string label = 2 [(buf.validate.field).string = { max_len: 4096 }];
  // reason is an optional free-text rationale, carried through for audit.
  string reason = 3 [(buf.validate.field).string = { max_len: 16777216 }];
}

message RejectOntologyExtensionProposalResponse {}

message SubmitOntologyExtensionUpstreamRequest {
  OntologyProposalKind kind = 1 [(buf.validate.field).enum = { defined_only: true }];
  string label = 2 [(buf.validate.field).string = { max_len: 4096 }];
  // idempotency_key makes a retry safe (ADR-0028). A second request with the
  // same key returns the result of the first request and does the work one
  // time. An empty key turns the protection off for the call.
  string idempotency_key = 3 [(buf.validate.field).string = { max_len: 128 }];
}

// SubmitOntologyExtensionUpstreamResponse carries the rendered SDK Domain
// Pack contribution artifact (ADR-0133 decision 2's final arrow: "owner
// 'submit upstream' -> contribution", gibson#393) — the exact file content a
// human or CI commits into the SDK's pack source tree to open the review PR.
//
// This daemon does NOT open that PR itself: gibson holds no GitHub credential
// or bot identity scoped to the `sdk` repository, and ADR-0133 names the
// contribution as "a PR into the SDK, which anyone may open" — a step the
// design deliberately leaves to a person, the same way other owner-only
// actions in this org (DNS, Stripe keys, required reviewers) are hand-offs
// rather than automated. suggested_pr_title/suggested_pr_body are meant to
// be pasted directly into that PR once the tenant owner (or whoever opens it)
// commits pack_json at suggested_file_path.
message SubmitOntologyExtensionUpstreamResponse {
  // Removed in gibson#502: served and never read by any consumer.
  reserved 1, 2, 3, 4;
  reserved "pack_json", "suggested_file_path", "suggested_pr_title", "suggested_pr_body";
  // audit_record_id names the place of the submitted fragment (gibson#712):
  // the audit record with the action "ontology.extension.submitted", whose
  // metadata holds the pack JSON. The Platform owner reviews it there.
  string audit_record_id = 5;
}

service OntologyExtensionService {
  // ListOntologyExtensionProposals returns every ontology/taxonomy extension
  // proposal this tenant's agents have made, pending and decided alike, so
  // the tenant owner (or an admin assisting them) has full visibility into
  // what agents are proposing (ADR-0133's "the tenant owner seeing every
  // proposal").
  rpc ListOntologyExtensionProposals(ListOntologyExtensionProposalsRequest) returns (ListOntologyExtensionProposalsResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "admin"
      object_type: "tenant"
      object_deriver: "tenant_from_identity"
      allowed_identities: 1  // USER
    };
  }

  // ApproveOntologyExtensionProposal is the tenant owner's explicit approval
  // of a pending proposal (ADR-0133 decision 3). Refused (NOT_FOUND) if
  // (kind, label) names no proposal ever observed in this tenant, and
  // (FAILED_PRECONDITION) if it already carries a terminal decision.
  //
  // Gated to "owner", not "admin": this is the stronger, singular
  // tenant-owner sign-off ADR-0133 decision 3 requires — not a routine
  // admin action any delegated admin may take.
  rpc ApproveOntologyExtensionProposal(ApproveOntologyExtensionProposalRequest) returns (ApproveOntologyExtensionProposalResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "owner"
      object_type: "tenant"
      object_deriver: "tenant_from_identity"
      allowed_identities: 1  // USER
    };
  }

  // RejectOntologyExtensionProposal is the tenant owner's explicit rejection
  // of a pending proposal. Same refusal rules as
  // ApproveOntologyExtensionProposal, and the same "owner" gate.
  rpc RejectOntologyExtensionProposal(RejectOntologyExtensionProposalRequest) returns (RejectOntologyExtensionProposalResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "owner"
      object_type: "tenant"
      object_deriver: "tenant_from_identity"
      allowed_identities: 1  // USER
    };
  }

  // SubmitOntologyExtensionUpstream renders a LIVE tenant extension (a
  // promoted proposal — NOT_FOUND if (kind, label) names no proposal ever
  // observed, FAILED_PRECONDITION if it has not yet been promoted) as an SDK
  // Domain Pack contribution artifact (ADR-0133 decision 2's "submit
  // upstream -> contribution"). Gated to "owner", mirroring
  // ApproveOntologyExtensionProposal: only the tenant that vouches for its
  // own live extension nominates it for the shared catalog.
  //
  // The handler writes the fragment as one audit record and returns its id
  // (gibson#712). The Platform owner reviews the fragment there. The RPC
  // opens no pull request.
  rpc SubmitOntologyExtensionUpstream(SubmitOntologyExtensionUpstreamRequest) returns (SubmitOntologyExtensionUpstreamResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "owner"
      object_type: "tenant"
      object_deriver: "tenant_from_identity"
      allowed_identities: 1  // USER
    };
  }
}
