syntax = "proto3";

package gibson.world.v1;

option go_package = "github.com/zeroroot-ai/gibson/internal/server/daemon/api/gibson/world/v1;worldv1";

import "gibson/auth/v1/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// WorldService is the daemon-mediated read path into the ECS brain (epic
// ecs-brain, gibson#752). The daemon resolves the caller's tenant server-side
// and reads only that tenant's live brain World + Timeline (one World per tenant,
// no cross-tenant anything — ADR-0101). The dashboard never touches the brain
// directly; it reads through here over Envoy + ext-authz, like TracesService.
//
// Every RPC is ext-authz-gated via the tenant member relation.
service WorldService {
  // ListMissions returns the tenant's missions (the work-graph roots).
  rpc ListMissions(ListMissionsRequest) returns (ListMissionsResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "member",
      object_type: "tenant",
      object_deriver: "tenant_from_identity",
      allowed_identities: 3  // USER | SERVICE
    };
  }

  // ListHosts returns the tenant's discovered hosts with belief/attention.
  rpc ListHosts(ListHostsRequest) returns (ListHostsResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "member",
      object_type: "tenant",
      object_deriver: "tenant_from_identity",
      allowed_identities: 3  // USER | SERVICE
    };
  }

  // ListFindings returns the tenant's confirmed findings.
  rpc ListFindings(ListFindingsRequest) returns (ListFindingsResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "member",
      object_type: "tenant",
      object_deriver: "tenant_from_identity",
      allowed_identities: 3  // USER | SERVICE
    };
  }

  // ListLlmCalls returns the tenant's LLM-call provenance (gibson#755): per-call
  // model + token data folded into the World, the replacement for the retired
  // Langfuse trace/cost views.
  rpc ListLlmCalls(ListLlmCallsRequest) returns (ListLlmCallsResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "member",
      object_type: "tenant",
      object_deriver: "tenant_from_identity",
      allowed_identities: 3  // USER | SERVICE
    };
  }

  // GetLlmCall returns one call's full detail including its Open Responses
  // record (request items and output items) — the conversation-view source
  // (gibson#755, dashboard#373). ListLlmCalls
  // stays metadata-only so a busy World's list response is not transcript-heavy.
  rpc GetLlmCall(GetLlmCallRequest) returns (GetLlmCallResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "member",
      object_type: "tenant",
      object_deriver: "tenant_from_identity",
      allowed_identities: 3  // USER | SERVICE
    };
  }

  // GetTimeline returns the tenant's domain-event Timeline — the Scroller scrubs
  // this. Optional mission_id filters to one mission's events.
  rpc GetTimeline(GetTimelineRequest) returns (GetTimelineResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "member",
      object_type: "tenant",
      object_deriver: "tenant_from_identity",
      allowed_identities: 3  // USER | SERVICE
    };
  }

  // GetFrameAt returns the World as of folding the first `seq` Timeline events —
  // a replay frame (ADR-0101: World == fold(Timeline)). This is what the Scroller
  // scrubs to: a server-side fold of the log to a point, not a stored snapshot.
  // `seq` is clamped to [0, total]; seq == total is the live World.
  rpc GetFrameAt(GetFrameAtRequest) returns (GetFrameAtResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "member",
      object_type: "tenant",
      object_deriver: "tenant_from_identity",
      allowed_identities: 3  // USER | SERVICE
    };
  }

  // ListReviewQueue returns the tenant's HITL review queue — surfaced surprises +
  // Findings, each with any label already applied (ADR-0106). The async labelling
  // UI reads this; it is a read-only projection and NEVER gates a mission.
  rpc ListReviewQueue(ListReviewQueueRequest) returns (ListReviewQueueResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "member",
      object_type: "tenant",
      object_deriver: "tenant_from_identity",
      allowed_identities: 3  // USER | SERVICE
    };
  }

  // SubmitLabel records a human review judgement (true/false-positive, severity,
  // category, dismiss) on a surfaced item, as a tenant-scoped LabelApplied event
  // (ADR-0106). Labels POOL across the tenant's users and NEVER cross tenants. It
  // is async: the call appends the event and returns; the mission never waits on
  // it. Any tenant member may label (the pool is shared), so the relation is
  // member, not admin.
  rpc SubmitLabel(SubmitLabelRequest) returns (SubmitLabelResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "writer",
      object_type: "tenant",
      object_deriver: "tenant_from_identity",
      allowed_identities: 3  // USER | SERVICE
    };
  }

  // ListLabels returns the tenant's pooled review labels (ADR-0106) — the HITL
  // training signal the offline trainer consumes alongside auto-outcomes.
  rpc ListLabels(ListLabelsRequest) returns (ListLabelsResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "member",
      object_type: "tenant",
      object_deriver: "tenant_from_identity",
      allowed_identities: 3  // USER | SERVICE
    };
  }

  // GetCalibration returns the tenant's reliability/calibration report from
  // settled bets (gibson#284, ADR-0122/ADR-0106): does a predicted 0.8 mean
  // 80% in reality? A tenant-wide summary plus a per-technique breakdown, each
  // with a Brier score and a binned reliability-diagram curve — the source for
  // the dashboard's reliability diagram (dashboard#98).
  rpc GetCalibration(GetCalibrationRequest) returns (GetCalibrationResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "member",
      object_type: "tenant",
      object_deriver: "tenant_from_identity",
      allowed_identities: 3  // USER | SERVICE
    };
  }

  // GetReputation returns one technique's current track record in one scope
  // (ADR-0122, ADR-0129 §3, gibson#267): does this technique tend to work
  // here? Read-only projection of the technique x environment belief a
  // settled bet updates (brain.UpdateReputation) — a caller that only needs
  // one key's current value, not the full tenant-wide breakdown
  // GetCalibration gives.
  rpc GetReputation(GetReputationRequest) returns (GetReputationResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "member",
      object_type: "tenant",
      object_deriver: "tenant_from_identity",
      allowed_identities: 3  // USER | SERVICE
    };
  }

  // ListOpenBets returns the tenant's placed-but-unsettled bets (gibson#339):
  // a Hypothesis that carries a bettable HypothesisID (ADR-0121/ADR-0122,
  // sdk#89) with no matching BetSettlement yet. Backend for dashboard#97's
  // HITL-settle review queue. Read-only, so relation is member like every
  // other WorldService read.
  rpc ListOpenBets(ListOpenBetsRequest) returns (ListOpenBetsResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "member",
      object_type: "tenant",
      object_deriver: "tenant_from_identity",
      allowed_identities: 3  // USER | SERVICE
    };
  }

  // ListProofReviews returns the proofs that wait for a human review
  // (ADR-0131, gibson#798). A proof that carries only evidence the agent
  // typed settles nothing: the daemon records it, and a reviewer reads the
  // evidence here and settles the bet with SettleBetByHITL. A proof leaves
  // the list when its bet settles by any path. Read-only, so the relation is
  // member like every other WorldService read.
  rpc ListProofReviews(ListProofReviewsRequest) returns (ListProofReviewsResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "member",
      object_type: "tenant",
      object_deriver: "tenant_from_identity",
      allowed_identities: 3  // USER | SERVICE
    };
  }

  // SettleBetByHITL records a human review verdict on a bet (gibson#280,
  // ADR-0123 decision 3): true_positive/false_positive settle the bet
  // (Engine.SettleBetByHITL); dismiss is label-only/no-settle, matching the
  // backend's own refusal semantics (a bet's binary settlement has no "not
  // actionable" outcome the way a surfaced surprise does). A settlement is a
  // more consequential, less reversible action than a plain read or label, so
  // this is gated at writer, not bare member — dashboard#97's settle action,
  // not every tenant member's review queue.
  rpc SettleBetByHITL(SettleBetByHITLRequest) returns (SettleBetByHITLResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "writer",
      object_type: "tenant",
      object_deriver: "tenant_from_identity",
      allowed_identities: 3  // USER | SERVICE
    };
  }

  // GetExposure returns the exposure window of one finding: the time from its
  // first evidence to its `verified` event, or to now for a finding that is not
  // verified. It splits the window into agent time and wait time (gibson#1467).
  rpc GetExposure(GetExposureRequest) returns (GetExposureResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "member",
      object_type: "tenant",
      object_deriver: "tenant_from_identity",
      allowed_identities: 3  // USER | SERVICE
    };
  }

  // GetExposureTrend returns the median exposure window of the findings that
  // were verified in a period, next to the median of the period before it
  // (gibson#1467).
  rpc GetExposureTrend(GetExposureTrendRequest) returns (GetExposureTrendResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "member",
      object_type: "tenant",
      object_deriver: "tenant_from_identity",
      allowed_identities: 3  // USER | SERVICE
    };
  }

  // GetRevertRate returns the share of merged fixes that an agent reverted in a
  // period, next to the share of the period before it (gibson#1468).
  rpc GetRevertRate(GetRevertRateRequest) returns (GetRevertRateResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "member",
      object_type: "tenant",
      object_deriver: "tenant_from_identity",
      allowed_identities: 3  // USER | SERVICE
    };
  }

  // ListOpenFindings returns the findings that are not `verified`. The order is
  // the priority (P1 to P4), then the belief of the target. A finding with no
  // priority ranks by its severity (gibson#1498).
  rpc ListOpenFindings(ListOpenFindingsRequest) returns (ListOpenFindingsResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "member",
      object_type: "tenant",
      object_deriver: "tenant_from_identity",
      allowed_identities: 3  // USER | SERVICE
    };
  }

  // ListActionsByGrant returns the connector calls of the agents in a time
  // range, grouped by the grant that allowed each one and by the person who gave
  // the grant. A refused call shows the grant that it lacked (gibson#1499).
  // The read shows the audit records of the whole tenant, so it takes the
  // relation of the tenant audit log, admin, as ListAuditEvents does
  // (gibson#1556 review m7).
  rpc ListActionsByGrant(ListActionsByGrantRequest) returns (ListActionsByGrantResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "admin",
      object_type: "tenant",
      object_deriver: "tenant_from_identity",
      allowed_identities: 3  // USER | SERVICE
    };
  }

  // ListWaitingOnPerson returns each item that waits on a person, with the wait
  // time so far (gibson#1500).
  rpc ListWaitingOnPerson(ListWaitingOnPersonRequest) returns (ListWaitingOnPersonResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "member",
      object_type: "tenant",
      object_deriver: "tenant_from_identity",
      allowed_identities: 3  // USER | SERVICE
    };
  }

  // ResolveFixAttempts is the action of a person on a wait of a failed fix job
  // (gibson#1674). The action retry ends a fix_attempts_failed wait: three fix jobs
  // failed in a row, the finding takes no new job, and the retry clears the failed
  // attempts so the next job can claim the finding. The action
  // merge_request_closed ends a merge_request_close_failed wait, after the person
  // closed the merge request that the daemon could not close. The daemon reads the
  // merge request on the Git host when the connector is there, and it refuses while
  // the merge request is open. The finding must belong to the tenant of the caller.
  // The daemon records who acted. The caller never names it. A person acts, so the
  // call is for a USER identity only: an agent can never clear its own block. Like a
  // settlement of a bet, it is gated at writer, not bare member.
  rpc ResolveFixAttempts(ResolveFixAttemptsRequest) returns (ResolveFixAttemptsResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "writer",
      object_type: "tenant",
      object_deriver: "tenant_from_identity",
      allowed_identities: 1  // USER
    };
  }
}

// MissionView is one mission as the World holds it.
message MissionView {
  string id = 1;
  string goal = 2;
  string status = 3;
  string reason = 4;
  // belief_model is the belief-model version the mission was pinned to at
  // launch (ADR-0134 §5). The daemon stamps the provider's current artifact
  // onto the mission when it starts, and the World carries it from there, so a
  // reviewer can tell which model judged a run. Empty means the mission ran
  // unpinned: an OSS install with no base model, or a placeholder provider.
  //
  // It is a RECORD, not a selector. Nothing re-selects a model from it: the
  // provider's version comes from the daemon's own configuration, and a replay
  // is a re-fold of the recorded BeliefScored events, which is reproducible by
  // construction. Re-executing a mission against the version it originally
  // pinned is not implemented.
  string belief_model = 5;
}

message HostView {
  string scope_id = 1;
  string address = 2;
  repeated int32 open_ports = 3;
  double juicy = 4;
  double attention = 5;
  string surprise = 6;
}

message FindingView {
  string id = 1;
  string title = 2;
  string scope_id = 3;
  string address = 4;
  string severity = 5;
}

// WorkItemView is one unit of work in a mission's frame (PRD #1059 M2,
// gibson#1061): an agent run, tool execution, or plugin invocation, reconstructed
// with its status as-of the folded tick. A WorkItem entity exists only once its
// WorkDispatched event has folded, so an item first appears at its dispatch tick
// with status "running" (in-flight) and reaches a terminal status (done / failed
// / skipped) at its completion tick. The in-flight set at a tick is the items
// with status "running"; terminal items are carried with their final status so
// the panel can show what the run already finished. Mission-scoped: only the
// mission's work appears in a mission-scoped frame (empty mission_id folds the
// whole tenant Timeline, so all tenant work appears).
message WorkItemView {
  string id = 1;
  string mission_id = 2; // owning mission ("" for free-standing work)
  string kind = 3;       // "tool" | "agent" | "plugin"
  string target = 4;     // the capability being executed
  string status = 5;     // "pending" | "running" | "done" | "failed" | "skipped"
}

// DecisionDispatchView is one action the Decider chose in a decision episode: the
// WorkItem it dispatched (gibson#1062). The work's own lifecycle is the matching
// WorkItemView; this is the decision→work linkage (what the Decider chose).
message DecisionDispatchView {
  string work_id = 1; // the dispatched WorkItem's id
  string kind = 2;    // "tool" | "agent" | "plugin"
  string target = 3;  // the capability the Decider chose to invoke
}

// DecisionView is one Decider decision episode reconstructed as-of the folded tick
// (PRD #1059 M2, gibson#1062): what the brain chose to do next, and why. A
// decision is opened by a DecisionRequested event (the brain asked itself what to
// do given the evidence so far) and closed by a DecisionCompleted event once the
// off-tick Decider worker has submitted its choices. A decision first appears at
// its request tick with status "pending" (in flight) and reaches "completed" at
// its completion tick, so it folds in cumulatively like the timeline. The chosen
// actions (the work the Decider dispatched) and, where the decision ended the
// mission, the completion reason as `rationale`, are carried as they fold in.
// Mission-scoped: only this mission's decisions appear in a mission-scoped frame.
message DecisionView {
  string id = 1;                              // stable per-mission id ("<mission_id>#d<n>")
  string mission_id = 2;                      // the goal mission this decision drives
  int64 cursor = 3;                           // evidence cursor at request time (its position in the run)
  string status = 4;                          // "pending" (in flight) | "completed"
  repeated DecisionDispatchView dispatches = 5; // the work the Decider chose to dispatch
  string outcome = 6;                         // mission outcome if the decision ended the mission ("" otherwise)
  string rationale = 7;                       // the completion reason, where present
}

message TimelineEvent {
  uint64 seq = 1;     // 0-based position in the tenant Timeline
  string kind = 2;    // event Kind(), e.g. "host.observed"
  string summary = 3; // human-readable one-line summary
  // time is the time that the event holds: the time of the fact, or the time
  // when the daemon read it. It is not set for an event that holds no time.
  google.protobuf.Timestamp time = 4;
  // replay_seq is the seq to give GetFrameAt (with the same mission_id) for
  // the World just after this event. It is seq + 1.
  uint64 replay_seq = 5;
  // finding_id and merge_request name the finding and the merge request that
  // the event is about. Each is empty when the event names none.
  string finding_id = 6;
  string merge_request = 7;
}

// LlmCallView is a single LLM completion's metadata (gibson#755): model + token
// counts + provenance ids. No transcript — the World holds call metadata only.
message LlmCallView {
  string call_id = 1;
  string run_id = 2; // the AgentRun that issued the call ("" for mission-level)
  string model = 3;
  string scope_id = 4;
  int32 prompt_tokens = 5;
  int32 completion_tokens = 6;
}

message ListMissionsRequest {
  // page_size is the most missions one page returns. Zero means 100.
  int32 page_size = 1 [(buf.validate.field).int32 = { gte: 0, lte: 1000 }];
  // page_token is the next_page_token of the previous page. Empty starts at
  // the first page. A token only works for the tenant and the request that
  // got it.
  string page_token = 2 [(buf.validate.field).string = { max_len: 1024 }];
}
message ListMissionsResponse {
  repeated MissionView missions = 1;
  // next_page_token continues the list. Empty means this is the last page.
  string next_page_token = 2;
}

message ListHostsRequest {
  // page_size is the most hosts one page returns. Zero means 100.
  int32 page_size = 1 [(buf.validate.field).int32 = { gte: 0, lte: 1000 }];
  // page_token is the next_page_token of the previous page. Empty starts at
  // the first page. A token only works for the tenant and the request that
  // got it.
  string page_token = 2 [(buf.validate.field).string = { max_len: 1024 }];
}
message ListHostsResponse {
  repeated HostView hosts = 1;
  // next_page_token continues the list. Empty means this is the last page.
  string next_page_token = 2;
}

message ListFindingsRequest {
  // page_size is the most findings one page returns. Zero means 100.
  int32 page_size = 1 [(buf.validate.field).int32 = { gte: 0, lte: 1000 }];
  // page_token is the next_page_token of the previous page. Empty starts at
  // the first page. A token only works for the tenant and the request that
  // got it.
  string page_token = 2 [(buf.validate.field).string = { max_len: 1024 }];
}
message ListFindingsResponse {
  repeated FindingView findings = 1;
  // next_page_token continues the list. Empty means this is the last page.
  string next_page_token = 2;
}

message ListLlmCallsRequest {
  // page_size is the most LLM calls one page returns. Zero means 100.
  int32 page_size = 1 [(buf.validate.field).int32 = { gte: 0, lte: 1000 }];
  // page_token is the next_page_token of the previous page. Empty starts at
  // the first page. A token only works for the tenant and the request that
  // got it.
  string page_token = 2 [(buf.validate.field).string = { max_len: 1024 }];
}
message ListLlmCallsResponse {
  repeated LlmCallView llm_calls = 1;
  // next_page_token continues the list. Empty means this is the last page.
  string next_page_token = 2;
}

// LlmCallDetail is the full record of one model call: the metadata of the
// LlmCallView and the Open Responses record of the call, read from the gateway
// trace (ADR-0172, ADR-0173). The record of a call is immutable.
//
// Each element of request_items and output_items is one Open Responses item as
// JSON text, in the form that the Timeline stores. The strings of an item are
// redacted by the redaction policy of the tenant when the event is folded. A
// reader parses each element and shows it by its "type".
message LlmCallDetail {
  // The old transcript fields. Nothing writes them after the cutover to the
  // gateway trace (no outside users: ADR-0027).
  reserved 7, 8;
  reserved "messages", "completion";

  string call_id = 1;
  string run_id = 2;
  string model = 3;
  string scope_id = 4;
  // The input and the output token counts of the call. A failed call has 0.
  int32 prompt_tokens = 5;
  int32 completion_tokens = 6;

  // The input items of the request, in order.
  repeated string request_items = 9;
  // The output items of the reply, in order. A failed call has none.
  repeated string output_items = 10;
  // The model provider that the gateway used, for example "openai".
  string provider = 11;
  // The HTTP status that the gateway answered. 0 means unknown. A status of 400
  // or more is a failed call.
  int32 http_status = 12;
  int32 cache_read_tokens = 13;
  int32 cache_write_tokens = 14;
  // The cost in US dollars as a decimal string, from the gateway trace only.
  // Empty means that the trace has no price for the model: show "Unknown". It is
  // never "0" for an unpriced model.
  string cost = 15;
  // The text of the reply of a failed call (a status of 400 or more). Empty for
  // a call that worked.
  string error_text = 16;
}

message GetLlmCallRequest {
  string call_id = 1 [(buf.validate.field).string = { max_len: 1024 }];
}
message GetLlmCallResponse { LlmCallDetail call = 1; }

message GetTimelineRequest {
  string mission_id = 1 [(buf.validate.field).string = { max_len: 1024 }];
  // finding_id keeps only the events of one finding: the events that name it,
  // and the events of each merge request of its fixes. Each event keeps its
  // seq in the unfiltered Timeline, so replay_seq still opens its frame.
  string finding_id = 4 [(buf.validate.field).string = { max_len: 1024 }];
  // page_size is the most events one page returns. Zero means 100.
  int32 page_size = 2 [(buf.validate.field).int32 = { gte: 0, lte: 1000 }];
  // page_token is the next_page_token of the previous page. Empty starts at
  // the first event. The pages follow the event seq, never the time.
  string page_token = 3 [(buf.validate.field).string = { max_len: 1024 }];
}
message GetTimelineResponse {
  repeated TimelineEvent events = 1;
  // next_page_token continues the list. Empty means this is the last page.
  string next_page_token = 2;
}

// GetFrameAtRequest scrubs to a Timeline position: fold the first `seq` events.
// Optional mission_id scopes the fold to one mission's slice of the Timeline
// (mirrors GetTimelineRequest): the frame then materializes only that mission's
// World and `seq`/`total` index the mission's slice, so the Scroller's timeline
// and its frames share one indexing. Empty folds the whole tenant Timeline
// (tenant-wide behavior unchanged).
message GetFrameAtRequest {
  uint64 seq = 1;
  string mission_id = 2 [(buf.validate.field).string = { max_len: 1024 }];
}

// GetFrameAtResponse is the World materialized at frame `seq` (a server-side fold).
message GetFrameAtResponse {
  uint64 seq = 1;                       // the position actually folded (clamped to [0,total])
  uint64 total = 2;                     // total events folded over: the tenant Timeline, or the mission's slice when mission_id is set
  repeated MissionView missions = 3;
  repeated HostView hosts = 4;
  repeated FindingView findings = 5;
  // The mission's WorkItems reconstructed as-of `seq` (PRD #1059 M2, gibson#1061):
  // in-flight work (status "running") plus terminal work with its final status.
  // Mission-scoped when mission_id is set; all tenant work when it is empty.
  repeated WorkItemView work = 6;
  // The mission's Decider decisions reconstructed as-of `seq` (PRD #1059 M2,
  // gibson#1062): what the brain chose to do next at each decision point and why.
  // A decision appears at its request tick ("pending") and reaches "completed" at
  // its completion tick, so the set folds in cumulatively. Mission-scoped when
  // mission_id is set; all tenant decisions when it is empty.
  repeated DecisionView decisions = 7;
  // The mission's LLM calls reconstructed as-of `seq` (PRD #1059 M2, gibson#1063):
  // the call metadata (model + token counts + provenance) for every completion
  // issued up to this tick, so token/cost/provenance line up with what's on screen.
  // A call appears at its own observation tick, so the set folds in cumulatively.
  // Mission-scoped via the run_id -> WorkItem -> mission linkage: a call belongs to
  // the mission when its run_id names a WorkItem the mission dispatched (a
  // mission-level call with empty run_id attaches to the mission directly). Empty
  // mission_id folds all tenant calls. Transcripts stay behind GetLlmCall.
  repeated LlmCallView llm_calls = 8;
}

// LabelView is one applied review label (a gibson.world.v1 view of a brain
// Label): the verdict, optional corrected severity/category, and the user who
// applied it (provenance only — labels pool tenant-wide; ADR-0106).
message LabelView {
  string target_id = 1; // the labelled item (a finding id or surprise host id)
  string verdict = 2;   // "true_positive" | "false_positive" | "dismiss"
  string severity = 3;  // corrected severity ("" = leave as-is)
  string category = 4;  // free-form taxonomy tag ("" = none)
  string user_id = 5;   // who applied it (provenance; not a partition key)
}

// ReviewItem is one entry in the HITL review queue: a surfaced surprise or a
// Finding awaiting (or carrying) a label.
message ReviewItem {
  string target_id = 1;   // the label target (finding id or surprise host id)
  string kind = 2;        // "finding" | "surprise"
  string title = 3;
  string scope_id = 4;
  string address = 5;
  string severity = 6;
  bool labelled = 7;      // true if a label has been applied
  LabelView label = 8;    // the applied label (set iff labelled)
}

message ListReviewQueueRequest {
  // page_size is the most items one page returns. Zero means 100.
  int32 page_size = 1 [(buf.validate.field).int32 = { gte: 0, lte: 1000 }];
  // page_token is the next_page_token of the previous page. Empty starts at
  // the first page. A token only works for the tenant and the request that
  // got it.
  string page_token = 2 [(buf.validate.field).string = { max_len: 1024 }];
}
message ListReviewQueueResponse {
  repeated ReviewItem items = 1;
  // next_page_token continues the list. Empty means this is the last page.
  string next_page_token = 2;
}

// SubmitLabelRequest applies a label to a surfaced item. The daemon stamps the
// caller's user id server-side from context — the client does not supply it, so a
// caller can never attribute a label to another user.
message SubmitLabelRequest {
  string target_id = 1 [(buf.validate.field).string = { min_len: 1, max_len: 1024 }]; // required: the finding id / surprise host id to label
  string verdict = 2 [(buf.validate.field).string = { max_len: 4096 }]; // required: "true_positive" | "false_positive" | "dismiss"
  string severity = 3 [(buf.validate.field).string = { max_len: 4096 }]; // optional corrected severity
  string category = 4 [(buf.validate.field).string = { max_len: 4096 }]; // optional taxonomy tag
  // idempotency_key makes a retry safe (ADR-0028). A second request with the
  // same key returns the result of the first request and does the work one
  // time. An empty key turns the protection off for the call.
  string idempotency_key = 5 [(buf.validate.field).string = { max_len: 128 }];
}
message SubmitLabelResponse {}

message ListLabelsRequest {
  // page_size is the most labels one page returns. Zero means 100.
  int32 page_size = 1 [(buf.validate.field).int32 = { gte: 0, lte: 1000 }];
  // page_token is the next_page_token of the previous page. Empty starts at
  // the first page. A token only works for the tenant and the request that
  // got it.
  string page_token = 2 [(buf.validate.field).string = { max_len: 1024 }];
}
message ListLabelsResponse {
  repeated LabelView labels = 1;
  // next_page_token continues the list. Empty means this is the last page.
  string next_page_token = 2;
}

// GetCalibrationRequest asks for the tenant's reliability/calibration report.
message GetCalibrationRequest {
  // bins is the number of equal-width predicted-probability buckets the
  // reliability curve is computed over. <= 0 uses the server's default
  // (deciles).
  int32 bins = 1;
}

// CalibrationBinView is one predicted-probability bucket of a reliability
// diagram: every settled, staked bet whose predicted probability fell in
// [low, high), and the mean predicted probability vs. the observed frequency
// of a TRUE verdict among them.
message CalibrationBinView {
  double low = 1;
  double high = 2;
  int32 n = 3;
  double mean_predicted = 4;
  double observed_frequency = 5;
}

// TechniqueCalibrationView is the reliability/calibration measure for one
// group of settled, staked bets: either every settled bet in the tenant
// (GetCalibrationResponse.overall, technique == "") or one specific
// technique's settled bets (GetCalibrationResponse.by_technique).
message TechniqueCalibrationView {
  string technique = 1;
  int32 n = 2;
  double mean_predicted = 3;
  double observed_frequency = 4;
  // brier_score is the mean squared error between each bet's predicted
  // probability and its observed outcome (0 or 1) — the standard proper
  // scoring rule for calibration (0 is perfect; lower is better).
  double brier_score = 5;
  repeated CalibrationBinView bins = 6;
}

// GetCalibrationResponse is gibson#284's full reliability answer for the
// caller's tenant.
message GetCalibrationResponse {
  string tenant = 1;
  TechniqueCalibrationView overall = 2;
  repeated TechniqueCalibrationView by_technique = 3;
  // unscored counts settled bets with no recorded claim-node belief (no bet
  // was ever staked for that hypothesis) — excluded from every aggregate
  // because calibration cannot compare a predicted probability that was
  // never staked. Surfaced, not hidden.
  int32 unscored = 4;
}

// ListOpenBetsRequest takes no fields: the caller's tenant resolves the same
// way it does for every other WorldService read.
message ListOpenBetsRequest {
  // page_size is the most bets one page returns. Zero means 100.
  int32 page_size = 1 [(buf.validate.field).int32 = { gte: 0, lte: 1000 }];
  // page_token is the next_page_token of the previous page. Empty starts at
  // the first page. A token only works for the tenant and the request that
  // got it.
  string page_token = 2 [(buf.validate.field).string = { max_len: 1024 }];
}

// ReferencedEntityView is an entity a bet's claim is about, by Taxonomy label
// and identity properties — the same by-label-and-properties addressing
// HypothesisObservation.references uses on the wire (sdk#70), so the review
// UI can show what the claim references without a graph node id.
message ReferencedEntityView {
  string label = 1;
  map<string, string> id_properties = 2;
}

// OpenBet is one placed-but-unsettled bet (gibson#339): a Hypothesis that
// carries a bettable HypothesisID with no matching BetSettlement yet.
//
// confidence is the claim's own self-reported confidence (Hypothesis.Confidence),
// NOT a reconciled market stake read back from BeliefSubstrate — that
// reconciliation is a pre-existing, tracked gap (gibson#273) this RPC does not
// close. run_id is the mission run that proposed the claim, for the review
// UI's transcript link; empty when the observation carried no run id.
message OpenBet {
  string hypothesis_id = 1;
  string claim = 2;
  string proposer = 3;
  double confidence = 4;
  repeated ReferencedEntityView evidence = 5;
  string run_id = 6;
}

message ListOpenBetsResponse {
  repeated OpenBet bets = 1;
  // next_page_token continues the list. Empty means this is the last page.
  string next_page_token = 2;
}

// ListProofReviewsRequest pages through the proofs that wait for a review,
// in hypothesis id order (ADR-0028 rule 3).
message ListProofReviewsRequest {
  // page_size is the most proofs one page returns. Zero means 100. The
  // daemon caps it at 1000 (internal/platform/pagetoken).
  int32 page_size = 1 [(buf.validate.field).int32 = { gte: 0 }];
  // page_token is the next_page_token of the previous page. Empty starts at
  // the first proof.
  string page_token = 2 [(buf.validate.field).string = { max_len: 1024 }];
}

// ProofEvidenceView is one item of evidence as the agent typed it. The
// content is redacted by the flight recorder policy of the tenant.
message ProofEvidenceView {
  string type = 1;
  string title = 2;
  string content = 3;
}

// ProofReview is one proof that waits for a human review. hypothesis_id is
// the bet that SettleBetByHITL settles.
message ProofReview {
  string hypothesis_id = 1;
  string mission_id = 2;
  string scope_id = 3;
  string technique = 4;
  repeated ProofEvidenceView evidence = 5;
  // submitted_at_unix_nano is the time the daemon received the proof.
  int64 submitted_at_unix_nano = 6;
}

message ListProofReviewsResponse {
  repeated ProofReview reviews = 1;
  // next_page_token is empty on the last page.
  string next_page_token = 2;
}

// SettleBetByHITLRequest names the bet and the reviewer's verdict.
// The reviewing user is resolved server-side from the caller's identity
// (ADR-0106 §6 provenance rule), never taken from the request — the same
// rule SubmitLabel already follows, so a caller can never attribute a
// settlement to another user.
message SettleBetByHITLRequest {
  string hypothesis_id = 1 [(buf.validate.field).string = { max_len: 1024 }];
  // verdict is true_positive, false_positive, or dismiss (the same
  // vocabulary SubmitLabel uses). dismiss applies a label only; it never
  // settles the bet.
  string verdict = 2 [(buf.validate.field).string = { max_len: 4096 }];
}

message SettleBetByHITLResponse {
  // settled is true only when this call caused a NEW settlement. false with
  // no error covers two honest non-events: the bet was already settled by
  // any of the three settlement paths (idempotent no-op), or the verdict was
  // dismiss (label-only/no-settle by design, never an error).
  bool settled = 1;
}

// GetReputationRequest names the technique x environment key (ADR-0129 §3):
// technique is the settlement.TechniqueID a Bet/Hypothesis names (e.g.
// "T1190"); scope_id is the "environment" — the same ScopeID coordinate
// every other observation in this brain partitions identity by.
message GetReputationRequest {
  string technique = 1 [(buf.validate.field).string = { max_len: 4096 }];
  string scope_id = 2 [(buf.validate.field).string = { max_len: 1024 }];
}

message GetReputationResponse {
  // Removed in gibson#502: served and never read by any consumer.
  reserved 1, 2;
  reserved "prior_strength", "has_track_record";
  // The fields below return the track record to the dashboard (gibson#619).
  // They take new numbers and names because the old ones stay reserved.
  //
  // prior is the confidence a NEW hypothesis of this technique, in this
  // scope, starts from (brain.Reputation.PriorStrength): the observed TRUE
  // frequency once settled bets exist, or the neutral DefaultReputationPrior
  // (0.5) when has_record is false.
  double prior = 3;
  // has_record is false when nothing is recorded for this key yet: "no
  // data", never a bare zero value.
  bool has_record = 4;
}

// ---------------------------------------------------------------------------
// The blue team console (gibson#1467, #1468, #1498, #1499, #1500)
// ---------------------------------------------------------------------------

message GetExposureRequest {
  string finding_id = 1 [(buf.validate.field).string = { min_len: 1, max_len: 256 }];
}
message GetExposureResponse {
  // found is false when the Timeline holds no event for the finding.
  bool found = 1;
  string finding_id = 2;
  google.protobuf.Timestamp start = 3;
  // end is the time of the `verified` event, or the time of the read.
  google.protobuf.Timestamp end = 4;
  bool verified = 5;
  int64 total_seconds = 6;
  // wait_seconds is the time in which the fix waits on a person or on a tool of
  // the buyer. agent_seconds is the rest.
  int64 wait_seconds = 7;
  int64 agent_seconds = 8;
}

message GetExposureTrendRequest {
  // period_seconds is the length of one period. Zero means 7 days.
  int64 period_seconds = 1 [(buf.validate.field).int64 = { gte: 0, lte: 31536000 }];
}
message GetExposureTrendResponse {
  int64 period_seconds = 1;
  // count is the number of findings verified in the period.
  int32 count = 2;
  int64 median_seconds = 3;
  int64 median_agent_seconds = 4;
  int64 median_wait_seconds = 5;
  int32 previous_count = 6;
  int64 previous_median_seconds = 7;
}

message GetRevertRateRequest {
  // period_seconds is the length of one period. Zero means 7 days.
  int64 period_seconds = 1 [(buf.validate.field).int64 = { gte: 0, lte: 31536000 }];
}
message RevertPeriod {
  int32 merged = 1;
  int32 reverted = 2;
  // rate is reverted divided by merged. It is 0 when nothing merged.
  double rate = 3;
}
message GetRevertRateResponse {
  int64 period_seconds = 1;
  RevertPeriod current = 2;
  RevertPeriod previous = 3;
}

// FindingPlace is the Application or the Host that a finding touches.
message FindingPlace {
  string label = 1;
  string key = 2;
}

// OpenFindingView is a finding that is not `verified`.
message OpenFindingView {
  string id = 1;
  string title = 2;
  string scope_id = 3;
  string address = 4;
  string severity = 5;
  // status is open, fixing or fixed.
  string status = 6;
  // priority is P1 to P4. It is empty until the triage agent sets one.
  string priority = 7;
  string priority_rule = 8;
  // confidence is the confidence of the check that raised the finding, from 0
  // to 1. It is 0 when the store holds no record of the finding.
  double confidence = 9;
  // merge_request is the key of the merge request of the fix. It is empty for
  // a finding with no fix. merge_request_url is the same value when it is a URL.
  string merge_request = 10;
  string merge_request_url = 11;
  repeated FindingPlace places = 12;
  // target_belief is the belief of the target, from 0 to 1.
  double target_belief = 13;
  string check_kind = 14;
}

message ListOpenFindingsRequest {
  // page_size is the most findings one page returns. Zero means 100.
  int32 page_size = 1 [(buf.validate.field).int32 = { gte: 0, lte: 1000 }];
  string page_token = 2 [(buf.validate.field).string = { max_len: 1024 }];
}
message ListOpenFindingsResponse {
  repeated OpenFindingView findings = 1;
  string next_page_token = 2;
}

message ListActionsByGrantRequest {
  // from and to are the time range. A zero from means 24 hours before to. A
  // zero to means now.
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  // page_size is the most groups one page returns. Zero means 100.
  int32 page_size = 3 [(buf.validate.field).int32 = { gte: 0, lte: 1000 }];
  // page_token is the next_page_token of the previous page, for the same
  // range. Empty starts at the first group.
  string page_token = 4 [(buf.validate.field).string = { max_len: 1024 }];
}
message ActionGroup {
  // grant_object and grant_relation name the grant that allowed the action. For
  // a refused action they name the grant that it lacked.
  string grant_object = 1;
  string grant_relation = 2;
  // grantor is the person who gave the grant. It is empty when the audit record
  // holds no grant for the action, and for a refused action.
  string grantor = 3;
  bool refused = 4;
  int32 count = 5;
  google.protobuf.Timestamp first = 6;
  google.protobuf.Timestamp last = 7;
  repeated string agents = 8;
  repeated string tools = 9;
  // audit_record_ids are the ids of the audit records of the actions of the
  // group, in the order of their time. The result record of each call is in
  // the list, and the intent record is not.
  repeated string audit_record_ids = 10;
}
message ListActionsByGrantResponse {
  repeated ActionGroup groups = 1;
  // truncated is true when the range holds more audit records than one read
  // returns.
  bool truncated = 2;
  // next_page_token continues the list. Empty means this is the last page.
  string next_page_token = 3;
}

message ListWaitingOnPersonRequest {
  // page_size is the most items one page returns. Zero means 100.
  int32 page_size = 1 [(buf.validate.field).int32 = { gte: 0, lte: 1000 }];
  string page_token = 2 [(buf.validate.field).string = { max_len: 1024 }];
}
message WaitingItem {
  // kind is destructive_action, merge_refused, next_scan, no_health_signal,
  // merge_unreadable or no_health_verdict.
  string kind = 1;
  // id is the id of the finding, or of the hypothesis for a destructive action.
  string id = 2;
  google.protobuf.Timestamp since = 3;
  int64 waited_seconds = 4;
  // reason says why the item waits, when the Timeline records a reason. For a
  // merge_refused item it is what the Git host said.
  string reason = 5;
}
message ListWaitingOnPersonResponse {
  repeated WaitingItem items = 1;
  // next_page_token continues the list. Empty means this is the last page.
  string next_page_token = 2;
}

message ResolveFixAttemptsRequest {
  // finding_id is the id of the finding that has the fix_attempts_failed wait.
  string finding_id = 1 [(buf.validate.field).string = { min_len: 1, max_len: 1024 }];
  // action is what the person decides: retry or merge_request_closed. The finding
  // states of ADR-0178 have no state for a dismissed finding or an accepted risk,
  // so no such action exists.
  string action = 2 [(buf.validate.field).string = { in: ["retry", "merge_request_closed"] }];
}

message ResolveFixAttemptsResponse {
  // cleared_attempts is the number of failed attempts that a retry cleared. It is
  // zero for the action merge_request_closed.
  int32 cleared_attempts = 1;
  // ended_waits is the number of merge_request_close_failed waits that the action
  // merge_request_closed ended. It is zero for a retry.
  int32 ended_waits = 2;
}
