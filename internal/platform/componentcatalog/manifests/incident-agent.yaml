id: incident-agent
kind: agent
displayName: Incident Agent
description: >-
  Contains an incident that a security tool of the buyer detected, with the
  response actions that the security team granted, and sends the cause of the
  incident to the fix loop. One dispatch is one task on one incident: contain,
  cause or release. The grant decides each response action, and a tool that
  the manifest of its connector marks waits for a person in the approval
  queue. It runs no attack.
# No egress. The agent reaches only the harness callback service. The daemon
# is the one caller of a connector.
spec:
  runtime: setec
  # Release 0.1.0 of zeroroot-ai/incident-agent, built on sdk v0.213.0.
  image: ghcr.io/zeroroot-ai/incident-agent@sha256:cdffe95e12486bcbcc54b81fdcfc3e482a1f98225e3ac1034d7fedb941ae4c6f
  dispatchMode: sandboxed
  # Untrusted: the agent reads alerts and tool results that the buyer's tools
  # wrote, so it runs only in a sandbox.
  contentTrust: untrusted
  # The sandbox launch command: the image ENTRYPOINT is not consulted by setec.
  command: "/incident-agent"
  resources:
    vcpu: 1
    memory: 1Gi
  # No credentials block. The agent holds no vendor credential: each response
  # action goes through invoke_tool, and the grant decides.
