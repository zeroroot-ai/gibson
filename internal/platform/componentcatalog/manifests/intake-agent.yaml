id: intake-agent
kind: agent
displayName: Intake Agent
description: >-
  An always-on bank member. It reads the security tools of the buyer through
  connectors, hands each flaw to the daemon as a finding and each detection as
  an Alert, and moves a read marker after each result that the daemon
  accepted. It holds no vendor credential. The daemon is the one caller of a
  connector.
# No egress. The agent reaches only the harness callback service.
#
# Follow-up for the next intake-agent release. Release 0.1.0 has neither of
# these, so this manifest names neither:
#   - The ticket mirror loop and the pager loop (intake-agent#8). They need the
#     connector classes `ticket` and `paging` in the loop grant of the member
#     (gibson#1612).
#   - The second binary /webhook-sender, the webhook to A2A sender (gibson#1451).
#     The manifest names it as a command when the release holds it.
spec:
  runtime: setec
  # Release 0.1.0 of zeroroot-ai/intake-agent, built on sdk v0.213.0.
  image: ghcr.io/zeroroot-ai/intake-agent@sha256:3944acc8a1b6228adca4f65b22ecc4218c8541fab069f269630d9fa7d8a0e4f6
  dispatchMode: sandboxed
  # Untrusted: the agent reads results that tools of the buyer wrote, so it
  # runs only in a sandbox.
  contentTrust: untrusted
  # The one-shot command. A member runs the member command.
  command: "/intake-agent"
  # The member shape: a long-lived process that reads the connectors in a loop
  # (ADR-0119).
  memberCommand: "/intake-agent"
  # The time between two reads of the connectors. The agent has no mission,
  # so the interval is not a mission constraint.
  env:
    INTAKE_INTERVAL: 5m
  maxJobsInFlight: 1
  resources:
    vcpu: 1
    memory: 1Gi
