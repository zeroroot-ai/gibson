# GitHub fix loop connector. Zero Root builds the MCP server in zeroroot-ai/connectors
# (github-fixloop/, release v0.8.2), because the vendor publishes no server with these tools.
# The image is public, signed and scanned. The catalog pins the digest of the image that the
# tag 0.8.2 resolves to, not the digest in the release notes (connectors#41).
# Source of the environment: github-fixloop/README.md of zeroroot-ai/connectors at v0.8.2.
# The server speaks streamable HTTP on :8080 at /mcp.
id: github-fixloop
kind: connector
displayName: GitHub fix loop
description: >-
  Reads the state and the deploy of a pull request, merges it on a green
  pipeline, and reverts a merge, for the fix loop.
spec:
  vendor: github
  class: git-host
  shape: Hosted
  image: ghcr.io/zeroroot-ai/connectors-github-fixloop@sha256:f248539564c8e15d54af93b9f46b5c1aaf80985afc96716eb66e20ebedf2f912
  # errorClasses: this image puts the class of a tool error in structuredContent.error.class
  # (connectors v0.8.0). The daemon trusts the class of this connector only.
  errorClasses: true
  transport: streamable-http
  port: 8080
  auth: none
  # Each credential is the name of a secret in the secret store of the
  # tenant. The operator puts the value in the pod. No value is in this file.
  credentials:
    - secret: github-fixloop-token
      env: GITHUB_TOKEN
  env:
    GITHUB_ENVIRONMENT: production
  # The tenant gives the API URL: https://api.github.com, or
  # https://<host>/api/v3 for GitHub Enterprise Server. The deploy
  # environment is production.
  # The egress allow-list of the pod holds the host of the value.
  # A GitHub Enterprise Server has no vendor domain, so the platform owner
  # of the install states its pattern in the chart (installPatterns).
  variables:
    - name: api_url
      env: GITHUB_API_URL
      kind: endpoint
      default: https://api.github.com
      patterns:
        - https://api.github.com
      installPatterns: true
    # A server behind a private CA needs
    # the CA certificates in the pod. The tenant names a secret of its own
    # store that holds a PEM bundle, stored with no category. The name starts with github-fixloop-ca-. The
    # value is optional (gibson#1517).
    - name: ca_bundle
      kind: ca_bundle
  # The server serves nine tools at 0.8.2: merge_request_state,
  # merge_merge_request, revert_merge_request, deployment_state,
  # open_merge_request, close_merge_request, read_file, list_tree and list_dependency_alerts. The fix agent opens a
  # fix with open_merge_request and undoes it with close_merge_request.
  # open_merge_request and close_merge_request never merge. The token needs contents:write and pull_requests:write.
  # The tools that the manifest does not name need only the grant, because the
  # entry has no response actions.
  # The scan mission calls list_dependency_alerts of this connector, with the
  # project of the scan, to read the dependency alerts of the Git host as
  # findings (connectors#29, release v0.6.0).
  # list_tree lists the files of a ref under a path. It is read-only and needs no more
  # than the grant.
  # GitHub: the token needs "Dependabot alerts" read and "Contents" read (list_tree
  # and read_file need Contents read). open_merge_request keeps the executable bit of a
  # file that it edits, and it refuses to overwrite a symlink, a submodule or a folder.
  # The merge tool runs only when the merge request holds its merge slot
  # (gibson#1458). Only the daemon calls the revert tool, after a failed
  # health signal that it read. The other tools need only the grant.
  tools:
    merge_merge_request:
      role: merge
    revert_merge_request:
      role: daemon
