# GitHub fix loop connector. Zero Root builds the MCP server in zeroroot-ai/connectors
# (github-fixloop/, release v0.2.0), because the vendor publishes no server with these tools.
# The image is public, signed and scanned, and the catalog pins it by digest.
# Source of the environment: github-fixloop/README.md of zeroroot-ai/connectors at v0.2.0.
# The server speaks streamable HTTP on :8080 at /mcp.
id: github-fixloop
kind: connector
displayName: GitHub fix loop
description: >-
  Reads the state and the deploy of a pull request, merges it on a green
  pipeline, and reverts a merge, for the fix loop.
spec:
  vendor: github
  class: git-host
  shape: Hosted
  image: ghcr.io/zeroroot-ai/connectors-github-fixloop@sha256:2120b5e92b8430e4815921d7f39ace987a4b1967b61a8569511bd864e3383d87
  transport: streamable-http
  port: 8080
  auth: none
  # Each credential is the name of a secret in the secret store of the
  # tenant. The operator puts the value in the pod. No value is in this file.
  credentials:
    - secret: github-fixloop-token
      env: GITHUB_TOKEN
  env:
    GITHUB_ENVIRONMENT: production
  # The tenant gives the API URL: https://api.github.com, or
  # https://<host>/api/v3 for GitHub Enterprise Server. The deploy
  # environment is production.
  # The egress allow-list of the pod holds the host of the value.
  # A GitHub Enterprise Server has no vendor domain, so the platform owner
  # of the install states its pattern in the chart (installPatterns).
  variables:
    - name: api_url
      env: GITHUB_API_URL
      kind: endpoint
      default: https://api.github.com
      patterns:
        - https://api.github.com
      installPatterns: true
    # A server behind a private CA needs
    # the CA certificates in the pod. The tenant names a secret of its own
    # store that holds a PEM bundle, stored with no category. The name starts with github-fixloop-ca-. The
    # value is optional (gibson#1517).
    - name: ca_bundle
      kind: ca_bundle
  # The merge tool runs only when the merge request holds its merge slot
  # (gibson#1458). Only the daemon calls the revert tool, after a failed
  # health signal that it read. The other tools need only the grant.
  tools:
    merge_merge_request:
      role: merge
    revert_merge_request:
      role: daemon
