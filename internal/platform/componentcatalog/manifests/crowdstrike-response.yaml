# CrowdStrike Falcon response connector. Zero Root builds the MCP server in zeroroot-ai/connectors
# (crowdstrike/, release v0.1.0), because the vendor publishes no server with these tools.
# The image is public, signed and scanned, and the catalog pins it by digest.
# Source of the environment: crowdstrike/README.md of zeroroot-ai/connectors at v0.1.0.
# The server speaks streamable HTTP on :8080 at /mcp.
id: crowdstrike-response
kind: connector
displayName: CrowdStrike Falcon response
description: >-
  Contains a Falcon host and lifts the containment. The vendor server
  falcon-mcp has no tool that contains a host.
spec:
  vendor: crowdstrike
  class: edr
  shape: Hosted
  image: ghcr.io/zeroroot-ai/connectors-crowdstrike@sha256:c9674fa2e81fcf8a833ce7c71fbe8fd50587329832c3a3d542334014742d7d13
  transport: streamable-http
  port: 8080
  auth: none
  # Each credential is the name of a secret in the secret store of the
  # tenant. The operator puts the value in the pod. No value is in this file.
  credentials:
    - secret: crowdstrike-response-client-id
      env: FALCON_CLIENT_ID
    - secret: crowdstrike-response-client-secret
      env: FALCON_CLIENT_SECRET
  # The tenant gives the API base URL of its Falcon cloud. The default is
  # https://api.crowdstrike.com (US-1), as the README of the server states.
  # The patterns are the API hosts of the Falcon clouds: US-1, US-2, EU-1,
  # US-GOV-1 and US-GOV-2 (CrowdStrike FalconPy, "Base URLs").
  # The egress allow-list of the pod holds the host of the value.
  variables:
    - name: api_url
      env: FALCON_BASE_URL
      kind: endpoint
      default: https://api.crowdstrike.com
      patterns:
        - https://api.crowdstrike.com
        - https://api.us-2.crowdstrike.com
        - https://api.eu-1.crowdstrike.com
        - https://api.laggar.gcw.crowdstrike.com
        - https://api.us-gov-2.crowdstrike.mil
  # Each tool is a response action. Revoke a session, disable an account and
  # isolate a host need no person (ADR-0180): only a tool that destroys data
  # waits for one. A new tool of the server waits until this list names it.
  responseActions: true
  tools:
    contain_host:
      approval: none
      undo: lift_containment
    lift_containment:
      approval: none
      undo: contain_host
