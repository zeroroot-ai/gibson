# GitHub plugin — the first-party Go plugin in plugins/github of this repo,
# hosted as a SVID pod beside Envoy (ADR-0066).
#
# Listing it here is what lets its check-in bind can_resolve on the secret it
# declares (cred:github_token): the daemon writes that binding only for a
# component carrying platform_enabled, which the startup seeder grants to a
# catalog entry whose image passes release-signature verification (gibson#554,
# ADR-0097). A plugin outside this table gets no binding from its own
# declaration; a tenant admin grants it.
#
# The image workflow (.github/workflows/gibson-images.yml) builds and signs the
# plugin image and writes the image line below through a pull request, with
# the source tree it built from (gibson#790). No person edits the image line.
# The exit test .github/workflows/exit-test-tool-dispatch.yml deploys this
# image.
# plugin-source-tree: a5572f6199bfc2bf54d7c33ac86d213d839aef69
id: github
kind: plugin
displayName: GitHub
description: >-
  Curated read/write over the GitHub REST API: repositories, issues and pull
  requests, authenticated with the tenant's GitHub token.
egressAllow:
  - api.github.com:443
spec:
  runtime: pod
  image: ghcr.io/zeroroot-ai/gibson-plugin-github@sha256:21b4084e852a6fdb70ef46728bf47bf4eaeff339cce9fcf10c1066801a638b52
  # Trusted, and four facts make it so. We wrote the code. The image is signed
  # and pinned by digest. The plugin passes the content it handles through and
  # does not execute or interpret it. Its egress is the one host above. An
  # entry for which one of these is false states untrusted.
  contentTrust: trusted
