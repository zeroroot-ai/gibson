# GitLab fix loop connector. Zero Root builds the MCP server in zeroroot-ai/connectors
# (gitlab-fixloop/, release v0.7.0), because the vendor publishes no server with these tools.
# The image is public, signed and scanned, and the catalog pins it by digest.
# Source of the environment: gitlab-fixloop/README.md of zeroroot-ai/connectors at v0.7.0.
# The server speaks streamable HTTP on :8080 at /mcp.
id: gitlab-fixloop
kind: connector
displayName: GitLab fix loop
description: >-
  Reads the state and the deploy of a merge request, merges it on a green
  pipeline, and reverts a merge, for the fix loop.
spec:
  vendor: gitlab
  class: git-host
  shape: Hosted
  image: ghcr.io/zeroroot-ai/connectors-gitlab-fixloop@sha256:3aa4ca17bca161855686d8f6e37577f24e3b7652edf970460b1e2054a38fbab0
  transport: streamable-http
  port: 8080
  auth: none
  # Each credential is the name of a secret in the secret store of the
  # tenant. The operator puts the value in the pod. No value is in this file.
  credentials:
    - secret: gitlab-fixloop-token
      env: GITLAB_TOKEN
  env:
    GITLAB_ENVIRONMENT: production
  # The tenant gives the address of its GitLab, for example
  # https://gitlab.com. The deploy environment is production.
  # The egress allow-list of the pod holds the host of the value.
  # A GitLab that the customer hosts has no vendor domain, so the platform
  # owner of the install states its pattern in the chart (installPatterns).
  variables:
    - name: base_url
      env: GITLAB_BASE_URL
      kind: endpoint
      patterns:
        - https://gitlab.com
      installPatterns: true
  # The server serves nine tools at v0.7.0: merge_request_state,
  # merge_merge_request, revert_merge_request, deployment_state,
  # open_merge_request, close_merge_request, read_file, list_tree and list_dependency_alerts. The fix agent opens a
  # fix with open_merge_request and undoes it with close_merge_request.
  # open_merge_request and close_merge_request never merge. The token needs the api scope.
  # The tools that the manifest does not name need only the grant, because the
  # entry has no response actions.
  # The scan mission calls list_dependency_alerts of this connector, with the
  # project of the scan, to read the dependency alerts of the Git host as
  # findings (connectors#29, release v0.6.0).
  # list_tree lists the files of a ref under a path (connectors#31, release v0.7.0). It is
  # read-only and needs no more than the grant. Its cursor is bound to the project, the ref
  # and the path.
  # GitLab: the token needs read_api, and the user of the token needs the Security Dashboard permission on a project of the Ultimate tier (the server reads the vulnerabilities through GraphQL).
  # The merge tool runs only when the merge request holds its merge slot
  # (gibson#1458). Only the daemon calls the revert tool, after a failed
  # health signal that it read. The other tools need only the grant.
  tools:
    merge_merge_request:
      role: merge
    revert_merge_request:
      role: daemon
