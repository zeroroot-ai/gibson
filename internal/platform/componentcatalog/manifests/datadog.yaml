# Datadog connector. Datadog runs the MCP server (ADR-0114, ADR-0177).
# Source of the endpoint: https://docs.datadoghq.com/bits_ai/mcp_server/setup/
# Source of the auth and the scope: https://mcp.datadoghq.com/.well-known/oauth-authorization-server
# The endpoint is the server of the US1 site. Datadog has one endpoint for
# each site (US3, US5, EU1, AP1, AP2, UK1). With no toolsets parameter, the
# server offers only the core toolset.
id: datadog
kind: connector
displayName: Datadog
description: >-
  The MCP server of Datadog. It reads monitors, metrics, logs and traces of
  the Datadog organization of the customer.
egressAllow:
  - mcp.datadoghq.com:443
spec:
  vendor: datadog
  class: observability
  shape: Remote
  endpoint: https://mcp.datadoghq.com/v1/mcp
  transport: streamable-http
  auth: oauth
  oauthScope: mcp_all
  defaultInstanceUrl: https://mcp.datadoghq.com/v1/mcp
