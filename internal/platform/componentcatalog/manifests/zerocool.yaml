# Zerocool agent — the flagship platform agent, launched-on-dispatch into an
# ephemeral setec sandbox (ADR-0136/0116). Its trust comes from this signed
# manifest (dispatchMode: sandboxed), not from the registry, because it is not a
# registered polling worker. Model is resolved newest at dispatch, so no model
# is pinned; budget is the tenant default, so no budgetLimit is set.
id: zerocool
kind: agent
displayName: Zerocool
description: >-
  The flagship agent — plans and runs a security mission end to end in an
  ephemeral sandbox, calling tools and connectors back through the daemon.
egressAllow:
  - "*"
spec:
  runtime: setec
  image: ghcr.io/zeroroot-ai/zerocool-agent@sha256:37f6fecc5577de79c7632e03361d23f98cbe16abe7855f0913c5b35dcaf877ab
  svid: spiffe://zeroroot.ai/agent/zerocool
  dispatchMode: sandboxed
  # Untrusted: the agent reads content the platform does not control, so it
  # runs only in a sandbox.
  contentTrust: untrusted
  # The sandbox launch command: the image ENTRYPOINT is not consulted by setec.
  command: "node /app/dist/serve-agent.js"
