---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: modelproviders.gibson.zeroroot.ai
spec:
  group: gibson.zeroroot.ai
  names:
    kind: ModelProvider
    listKind: ModelProviderList
    plural: modelproviders
    shortNames:
    - mp
    singular: modelprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tenantID
      name: Tenant
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.credentialSecretName
      name: Secret
      priority: 1
      type: string
    - jsonPath: .status.lastError
      name: LastError
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ModelProvider is one model provider that a tenant configured. The
          tenant-operator renders it into model gateway objects: one backend and one
          route for each provider, and two backends for Bedrock. The routes match only
          the calls of the tenant.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ModelProviderSpec defines one model provider of one tenant. The name of the
              resource is the name of the provider in the tenant. A caller of the model
              gateway selects the provider with that name.
            properties:
              baseURL:
                description: |-
                  BaseURL replaces the default endpoint of the provider. It is required for
                  openai-compatible and optional for anthropic and openai.
                pattern: ^https://[^/?#@\s]+(/[^?#\s]*)?$
                type: string
              caBundleSecret:
                description: |-
                  CABundleSecret is the name of the tenant secret that holds the PEM CA
                  bundle that signs the certificate of the backend. Empty means the gateway
                  verifies the backend with its public roots. The resource holds no bundle.
                  The tenant operator copies it into the credential Secret under the key
                  ca.crt.
                maxLength: 253
                type: string
              credentialSecret:
                description: |-
                  CredentialSecret is the name of the tenant secret in OpenBao that holds the
                  credential of the provider. The resource holds no credential. The gateway
                  reads the credential from a Kubernetes Secret in its own namespace, and no
                  other workload reads it.
                maxLength: 253
                minLength: 1
                type: string
              modelFilter:
                description: |-
                  ModelFilter limits the models that the gateway lets through for this
                  provider. Empty allows every model.
                properties:
                  allow:
                    description: |-
                      Allow is a list of model name patterns. A pattern may hold the wildcard
                      "*". A model passes when its name matches one pattern.
                    items:
                      type: string
                    maxItems: 64
                    type: array
                type: object
              projectID:
                description: ProjectID is the Google Cloud project of a vertexai provider.
                type: string
              region:
                description: Region is the cloud region of a bedrock or vertexai provider.
                pattern: ^[a-z0-9-]+$
                type: string
              tenantID:
                description: |-
                  TenantID is the canonical tenant identifier. The gateway routes of the
                  provider match only the calls of this tenant. Immutable.
                maxLength: 63
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: tenantID is immutable
                  rule: self == oldSelf
              type:
                description: Type is the kind of the provider. Immutable.
                enum:
                - anthropic
                - openai
                - openai-compatible
                - bedrock
                - gemini
                - vertexai
                type: string
                x-kubernetes-validations:
                - message: type is immutable
                  rule: self == oldSelf
            required:
            - credentialSecret
            - tenantID
            - type
            type: object
            x-kubernetes-validations:
            - message: an openai-compatible provider needs a baseURL
              rule: self.type != 'openai-compatible' || has(self.baseURL)
            - message: a bedrock provider needs a region
              rule: self.type != 'bedrock' || has(self.region)
            - message: a vertexai provider needs a region and a projectID
              rule: self.type != 'vertexai' || (has(self.region) && has(self.projectID))
          status:
            description: ModelProviderStatus defines the observed state of a ModelProvider.
            properties:
              conditions:
                description: 'Conditions represent the current state. Standard condition
                  type: Ready.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              credentialSecretName:
                description: |-
                  CredentialSecretName is the name of the Kubernetes Secret that the gateway
                  reads. Whoever materializes the credential from OpenBao writes that name.
                type: string
              lastError:
                description: |-
                  LastError is the message of the last failed reconcile. It is cleared on a
                  good reconcile.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation that the last reconcile
                  saw.
                format: int64
                type: integer
              phase:
                description: Phase is the lifecycle phase.
                enum:
                - Pending
                - WaitingForCredential
                - Ready
                - Failed
                type: string
              ready:
                description: |-
                  Ready is true when the gateway objects exist and the credential Secret
                  exists.
                type: boolean
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
