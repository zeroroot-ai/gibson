apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  annotations:
    gibson.zeroroot.ai/credential-secret: provider-mock
  labels:
    app.kubernetes.io/managed-by: gibson-tenant-operator
    gibson.zeroroot.ai/model-provider: mock
    gibson.zeroroot.ai/model-provider-namespace: tenant-acme
    gibson.zeroroot.ai/tenant: acme
  name: mp-acme-mock
  namespace: gibson-gateway
spec:
  ai:
    provider:
      host: mockprovider.example.svc
      openai: {}
      pathPrefix: /v1
      port: 8443
  policies:
    ai:
      routes:
        /v1/embeddings: Embeddings
        /v1/models: Passthrough
        /v1/responses: Responses
    auth:
      secretRef:
        name: mp-acme-mock-credential
    tls:
      caCertificateRefs:
      - key: ca.crt
        kind: Secret
        name: mp-acme-mock-credential
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app.kubernetes.io/managed-by: gibson-tenant-operator
    gibson.zeroroot.ai/model-provider: mock
    gibson.zeroroot.ai/model-provider-namespace: tenant-acme
    gibson.zeroroot.ai/tenant: acme
  name: mp-acme-mock
  namespace: gibson-gateway
spec:
  parentRefs:
  - name: model-gateway
  rules:
  - backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: mp-acme-mock
    matches:
    - headers:
      - name: x-gibson-route-tenant
        type: Exact
        value: acme
      - name: x-gibson-route-provider
        type: Exact
        value: mock
      path:
        type: Exact
        value: /v1/responses
    - headers:
      - name: x-gibson-route-tenant
        type: Exact
        value: acme
      - name: x-gibson-route-provider
        type: Exact
        value: mock
      path:
        type: Exact
        value: /v1/embeddings
  - backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: mp-acme-mock
    matches:
    - headers:
      - name: x-gibson-route-tenant
        type: Exact
        value: acme
      - name: x-gibson-route-provider
        type: Exact
        value: mock
      path:
        type: Exact
        value: /v1/models
