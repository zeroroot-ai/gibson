apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  annotations:
    gibson.zeroroot.ai/credential-secret: provider-claude
  labels:
    app.kubernetes.io/managed-by: gibson-tenant-operator
    gibson.zeroroot.ai/model-provider: claude
    gibson.zeroroot.ai/model-provider-namespace: tenant-acme
    gibson.zeroroot.ai/tenant: acme
  name: mp-acme-claude
  namespace: gibson-gateway
spec:
  ai:
    provider:
      anthropic: {}
  policies:
    ai:
      routes:
        /v1/embeddings: Embeddings
        /v1/models: Passthrough
        /v1/responses: Responses
    auth:
      secretRef:
        name: mp-acme-claude-credential
    authorization:
      action: Allow
      policy:
        matchExpressions:
        - request.path == "/v1/models" || json(request.body).model.matches("^(?:claude-.*|haiku-4)$")
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app.kubernetes.io/managed-by: gibson-tenant-operator
    gibson.zeroroot.ai/model-provider: claude
    gibson.zeroroot.ai/model-provider-namespace: tenant-acme
    gibson.zeroroot.ai/tenant: acme
  name: mp-acme-claude
  namespace: gibson-gateway
spec:
  parentRefs:
  - name: model-gateway
  rules:
  - backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: mp-acme-claude
    matches:
    - headers:
      - name: x-gibson-route-tenant
        type: Exact
        value: acme
      - name: x-gibson-route-provider
        type: Exact
        value: claude
      path:
        type: Exact
        value: /v1/responses
    - headers:
      - name: x-gibson-route-tenant
        type: Exact
        value: acme
      - name: x-gibson-route-provider
        type: Exact
        value: claude
      path:
        type: Exact
        value: /v1/embeddings
  - backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: mp-acme-claude
    matches:
    - headers:
      - name: x-gibson-route-tenant
        type: Exact
        value: acme
      - name: x-gibson-route-provider
        type: Exact
        value: claude
      path:
        type: Exact
        value: /v1/models
