apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  labels:
    app.kubernetes.io/managed-by: gibson-tenant-operator
    gibson.zeroroot.ai/outside-agent: open-scout
    gibson.zeroroot.ai/tenant: acme
  name: oa-acme-open-scout
  namespace: gibson-gateway
spec:
  a2a:
    host: open.partner.example
    port: 8443
  policies:
    tls:
      sni: open.partner.example
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app.kubernetes.io/managed-by: gibson-tenant-operator
    gibson.zeroroot.ai/outside-agent: open-scout
    gibson.zeroroot.ai/tenant: acme
  name: oa-acme-open-scout
  namespace: gibson-gateway
spec:
  parentRefs:
  - name: agent-gateway
  rules:
  - backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: oa-acme-open-scout
    filters:
    - requestHeaderModifier:
        remove:
        - x-gibson-tenant
        - x-gibson-subject
        - x-gibson-mission
        - x-gibson-task
        - x-gibson-route-tenant
        - x-gibson-route-agent
        - x-gibson-route-bank
        - x-gibson-identity-tenant
        - x-gibson-identity-subject
        - x-capability-grant
      type: RequestHeaderModifier
    - type: URLRewrite
      urlRewrite:
        path:
          replaceFullPath: /
          type: ReplaceFullPath
    matches:
    - headers:
      - name: x-gibson-route-tenant
        type: Exact
        value: acme
      - name: x-gibson-route-agent
        type: Exact
        value: open-scout
      path:
        type: Exact
        value: /
  - backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: oa-acme-open-scout
    filters:
    - requestHeaderModifier:
        remove:
        - x-gibson-tenant
        - x-gibson-subject
        - x-gibson-mission
        - x-gibson-task
        - x-gibson-route-tenant
        - x-gibson-route-agent
        - x-gibson-route-bank
        - x-gibson-identity-tenant
        - x-gibson-identity-subject
        - x-capability-grant
      type: RequestHeaderModifier
    - type: URLRewrite
      urlRewrite:
        path:
          replaceFullPath: /.well-known/agent-card.json
          type: ReplaceFullPath
    matches:
    - headers:
      - name: x-gibson-route-tenant
        type: Exact
        value: acme
      - name: x-gibson-route-agent
        type: Exact
        value: open-scout
      path:
        type: Exact
        value: /agents/open-scout/.well-known/agent-card.json
