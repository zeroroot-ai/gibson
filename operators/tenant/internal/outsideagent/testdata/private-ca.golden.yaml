apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  annotations:
    gibson.zeroroot.ai/credential-secret: scout-key
  labels:
    app.kubernetes.io/managed-by: gibson-tenant-operator
    gibson.zeroroot.ai/outside-agent: private-scout
    gibson.zeroroot.ai/tenant: acme
  name: oa-acme-private-scout
  namespace: gibson-gateway
spec:
  a2a:
    host: scout.corp.example
    port: 443
  policies:
    auth:
      secretRef:
        name: oa-acme-private-scout-credential
    tls:
      caCertificateRefs:
      - key: ca.crt
        kind: Secret
        name: oa-acme-private-scout-credential
      sni: scout.corp.example
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app.kubernetes.io/managed-by: gibson-tenant-operator
    gibson.zeroroot.ai/outside-agent: private-scout
    gibson.zeroroot.ai/tenant: acme
  name: oa-acme-private-scout
  namespace: gibson-gateway
spec:
  parentRefs:
  - name: agent-gateway
  rules:
  - backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: oa-acme-private-scout
    filters:
    - requestHeaderModifier:
        remove:
        - x-gibson-tenant
        - x-gibson-subject
        - x-gibson-mission
        - x-gibson-task
        - x-gibson-route-tenant
        - x-gibson-route-agent
        - x-gibson-route-bank
        - x-gibson-identity-tenant
        - x-gibson-identity-subject
        - x-capability-grant
      type: RequestHeaderModifier
    - type: URLRewrite
      urlRewrite:
        path:
          replaceFullPath: /a2a
          type: ReplaceFullPath
    matches:
    - headers:
      - name: x-gibson-route-tenant
        type: Exact
        value: acme
      - name: x-gibson-route-agent
        type: Exact
        value: private-scout
      path:
        type: Exact
        value: /
  - backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: oa-acme-private-scout
    filters:
    - requestHeaderModifier:
        remove:
        - x-gibson-tenant
        - x-gibson-subject
        - x-gibson-mission
        - x-gibson-task
        - x-gibson-route-tenant
        - x-gibson-route-agent
        - x-gibson-route-bank
        - x-gibson-identity-tenant
        - x-gibson-identity-subject
        - x-capability-grant
      type: RequestHeaderModifier
    - type: URLRewrite
      urlRewrite:
        path:
          replaceFullPath: /a2a/.well-known/agent-card.json
          type: ReplaceFullPath
    matches:
    - headers:
      - name: x-gibson-route-tenant
        type: Exact
        value: acme
      - name: x-gibson-route-agent
        type: Exact
        value: private-scout
      path:
        type: Exact
        value: /agents/private-scout/.well-known/agent-card.json
