apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  annotations:
    gibson.zeroroot.ai/credential-secret: partner-key
  labels:
    app.kubernetes.io/managed-by: gibson-tenant-operator
    gibson.zeroroot.ai/outside-agent: partner-scout
    gibson.zeroroot.ai/tenant: acme
  name: oa-acme-partner-scout
  namespace: gibson-gateway
spec:
  a2a:
    host: agent.partner.example
    port: 443
  policies:
    auth:
      secretRef:
        name: oa-acme-partner-scout-credential
    tls:
      sni: agent.partner.example
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app.kubernetes.io/managed-by: gibson-tenant-operator
    gibson.zeroroot.ai/outside-agent: partner-scout
    gibson.zeroroot.ai/tenant: acme
  name: oa-acme-partner-scout
  namespace: gibson-gateway
spec:
  parentRefs:
  - name: agent-gateway
    sectionName: agent
  rules:
  - backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: oa-acme-partner-scout
    filters:
    - requestHeaderModifier:
        remove:
        - x-gibson-tenant
        - x-gibson-subject
        - x-gibson-mission
        - x-gibson-task
        - x-gibson-identity-subject
        - x-gibson-identity-issuer
        - x-gibson-identity-credential-type
        - x-gibson-identity-tenant
        - x-gibson-identity-issued-at
        - x-gibson-route-tenant
        - x-gibson-route-provider
        - x-gibson-route-agent
        - x-gibson-route-bank
        - x-capability-grant
      type: RequestHeaderModifier
    - type: URLRewrite
      urlRewrite:
        path:
          replaceFullPath: /a2a
          type: ReplaceFullPath
    matches:
    - headers:
      - name: x-gibson-route-tenant
        type: Exact
        value: acme
      - name: x-gibson-route-agent
        type: Exact
        value: partner-scout
      path:
        type: Exact
        value: /
  - backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: oa-acme-partner-scout
    filters:
    - requestHeaderModifier:
        remove:
        - x-gibson-tenant
        - x-gibson-subject
        - x-gibson-mission
        - x-gibson-task
        - x-gibson-identity-subject
        - x-gibson-identity-issuer
        - x-gibson-identity-credential-type
        - x-gibson-identity-tenant
        - x-gibson-identity-issued-at
        - x-gibson-route-tenant
        - x-gibson-route-provider
        - x-gibson-route-agent
        - x-gibson-route-bank
        - x-capability-grant
      type: RequestHeaderModifier
    - type: URLRewrite
      urlRewrite:
        path:
          replaceFullPath: /a2a/.well-known/agent-card.json
          type: ReplaceFullPath
    matches:
    - headers:
      - name: x-gibson-route-tenant
        type: Exact
        value: acme
      - name: x-gibson-route-agent
        type: Exact
        value: partner-scout
      path:
        type: Exact
        value: /agents/partner-scout/.well-known/agent-card.json
