# A minimal ClusterSPIFFEID CRD for envtest. The real one comes from the
# SPIRE controller-manager chart. The tenant-operator writes ClusterSPIFFEIDs
# (plugin instances, and the belief trainer of each tenant, gibson#1164), so
# the envtest API server must serve the kind. The schema keeps unknown fields:
# the unit tests of the builders check the spec shape.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterspiffeids.spire.spiffe.io
spec:
  group: spire.spiffe.io
  scope: Cluster
  names:
    kind: ClusterSPIFFEID
    listKind: ClusterSPIFFEIDList
    plural: clusterspiffeids
    singular: clusterspiffeid
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
